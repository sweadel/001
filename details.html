<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | Asset Inspection V149.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="src/database.js"></script>
    <script src="src/ui.js"></script>
</head>
<body class="rtl bg-[#050505] text-white overflow-x-hidden">
    <div id="cursor"></div>

    <nav class="p-8 flex justify-between items-center glass sticky top-0 z-[100]">
        <a href="index.html" class="text-2xl font-black text-gold tracking-tighter">ZOLNGEN</a>
        <a href="index.html" class="opacity-50 hover:opacity-100 transition-all font-bold">Back to Store</a>
    </nav>

    <main class="min-h-screen flex items-center justify-center p-10 lg:p-20">
        <div id="details-content" class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-20">
            <div class="flex items-center justify-center opacity-20"><i class="fas fa-microchip text-[200px] text-gold animate-pulse"></i></div>
            <div class="flex flex-col justify-center">
                <p id="p-sku" class="text-gold opacity-50 uppercase tracking-[10px] text-xs mb-4">NODE-SCANNING...</p>
                <h1 id="p-name" class="text-6xl lg:text-8xl font-black mb-8 tracking-tighter">ZOLNGEN ASSET</h1>
                <p class="opacity-40 text-lg leading-relaxed mb-12">This premium hardware node has been verified for institutional use. It features ultra-low latency architecture and military-grade encryption protocols.</p>
                <div class="flex items-baseline gap-4 mb-12">
                    <span id="p-price" class="text-6xl font-black text-gold">$0</span>
                    <span class="opacity-20 text-sm uppercase">Institutional Value</span>
                </div>
                <div class="flex gap-6">
                    <button onclick="addToCartAndGo()" class="flex-1 bg-gold text-black py-6 rounded-3xl font-black text-xl hover:scale-105 transition-all shadow-2xl">Acquire Asset</button>
                    <div class="p-6 glass rounded-3xl text-center"><p class="text-[10px] opacity-40 uppercase">Stock</p><h4 id="p-stock" class="text-2xl font-black">0</h4></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentProduct = null;
        async function loadProduct() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(!id) { window.location.href = 'index.html'; return; }

            const products = await ZolngenDB.getProducts();
            currentProduct = products.find(p => p.id == id);

            if(currentProduct) {
                document.getElementById('p-name').innerText = currentProduct.name;
                document.getElementById('p-sku').innerText = currentProduct.sku;
                document.getElementById('p-price').innerText = `$${currentProduct.price.toLocaleString()}`;
                document.getElementById('p-stock').innerText = currentProduct.stock;
                gsap.from("#details-content > div", { opacity: 0, x: 50, stagger: 0.3, duration: 1 });
            } else {
                ZolngenUI.showToast("Asset Not Found", "error");
                setTimeout(() => window.location.href = 'index.html', 2000);
            }
        }

        function addToCartAndGo() {
            // Simulated cart logic for details page
            ZolngenUI.showToast(`${currentProduct.name} Added to Procurement Queue`);
            setTimeout(() => window.location.href = 'index.html', 1500);
        }
        loadProduct();
    </script>
</body>
</html>
