<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | كتالوج التوريد المؤسسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="bg-[#050505] text-white">
    <canvas id="neural-bg"></canvas>

    <nav class="fixed top-0 w-full z-[100] glass border-b border-white/5 py-6">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black text-gold">ZOLNGEN <span class="text-[8px] uppercase tracking-widest text-white/40 block">Enterprise Pro</span></a>
            <div class="flex gap-8 items-center">
                <button onclick="toggleCart()" class="relative group">
                    <i class="fas fa-shopping-cart text-xl group-hover:text-gold transition-all"></i>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-gold text-dark text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center">0</span>
                </button>
                <a href="index.html" class="text-sm font-bold opacity-60 hover:opacity-100">الرئيسية</a>
            </div>
        </div>
    </nav>

    <main class="pt-40 pb-20 container mx-auto px-6">
        <header class="mb-20">
            <h1 class="text-6xl font-black mb-4 tracking-tighter">Institutional Catalog</h1>
            <p class="text-gray-500 uppercase tracking-widest text-xs">أحدث حلول الحوسبة للمؤسسات والشركات</p>
            
            <div class="mt-12 flex flex-wrap gap-4">
                <input type="text" id="search" placeholder="ابحث عن جهاز أو مواصفات معينة..." oninput="renderProducts()" class="flex-1 min-w-[300px] glass p-5 rounded-2xl border-white/5 focus:border-gold/30 transition-all outline-none">
                <select id="cat-filter" onchange="renderProducts()" class="glass p-5 rounded-2xl border-none text-gray-400 outline-none">
                    <option value="all">كافة الفئات</option>
                    <option value="أجهزة محمولة">أجهزة محمولة</option>
                    <option value="خوادم">خوادم</option>
                    <option value="مكتبي">مكتبي</option>
                </select>
            </div>
        </header>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- Products will be rendered here -->
        </div>
    </main>

    <!-- CART SIDEBAR -->
    <div id="cart-sidebar" class="fixed top-0 left-0 h-full w-[400px] glass z-[200] translate-x-[-100%] transition-all duration-500 border-r border-white/10 flex flex-col p-10">
        <div class="flex justify-between items-center mb-12">
            <h3 class="text-3xl font-black text-gold">سلة التوريد</h3>
            <button onclick="toggleCart()" class="text-2xl opacity-50 hover:opacity-100">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-6"></div>
        <div class="mt-12 pt-8 border-t border-white/10">
            <div class="flex justify-between text-xl font-bold mb-8">
                <span>الإجمالي التقديري</span>
                <span id="cart-total" class="text-gold">0 JOD</span>
            </div>
            <button onclick="checkout()" class="w-full bg-gold text-dark py-5 rounded-2xl font-black text-lg shadow-2xl shadow-gold/20 hover:scale-105 transition-all">إتمام طلب التوريد</button>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="ui.js"></script>
    <script>
        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const search = document.getElementById('search').value.toLowerCase();
            const cat = document.getElementById('cat-filter').value;
            const prods = DB.getProducts();

            const filtered = prods.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search) || p.specs.toLowerCase().includes(search);
                const matchesCat = cat === 'all' || p.category === cat;
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-40 text-center opacity-30 text-xl font-bold uppercase tracking-widest">لم يتم العثور على نتائج مطابقة</div>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="glass p-10 rounded-[48px] border border-white/5 group hover:border-gold/30 transition-all">
                    <div class="h-56 flex items-center justify-center mb-8">
                        <img src="${p.img}" alt="${p.name}" class="max-h-full object-contain group-hover:scale-110 transition-all duration-500">
                    </div>
                    <div class="space-y-4">
                        <span class="text-[8px] uppercase tracking-widest text-gold opacity-60">${p.category}</span>
                        <h4 class="text-2xl font-black">${p.name}</h4>
                        <p class="text-xs text-gray-500 leading-relaxed">${p.specs}</p>
                        <div class="flex justify-between items-center pt-8">
                            <span class="text-2xl font-black text-gold">${p.price} JOD</span>
                            <button onclick="addToCart('${p.id}')" class="bg-white/5 p-4 rounded-2xl hover:bg-gold hover:text-dark transition-all">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = DB.getProducts().find(p => p.id === id);
            cart.push(prod);
            updateCart();
            UI.showToast('تمت الإضافة للسلة');
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items');
            list.innerHTML = cart.map((p, i) => `
                <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/5">
                    <div>
                        <p class="font-bold text-sm">${p.name}</p>
                        <p class="text-[10px] text-gold font-mono">${p.price} JOD</p>
                    </div>
                    <button onclick="cart.splice(${i}, 1); updateCart();" class="text-red-500/50 hover:text-red-500">&times;</button>
                </div>
            `).join('');
            const total = cart.reduce((acc, p) => acc + p.price, 0);
            document.getElementById('cart-total').innerText = total + ' JOD';
        }

        function toggleCart() {
            const side = document.getElementById('cart-sidebar');
            side.classList.toggle('translate-x-0');
        }

        function checkout() {
            if (cart.length === 0) return UI.showToast('السلة فارغة');
            const session = Auth.getSession();
            if (!session) return UI.showToast('يرجى تسجيل الدخول أولاً');
            
            const total = cart.reduce((acc, p) => acc + p.price, 0);
            DB.placeOrder({
                entity: session.name,
                items: cart.map(p => p.name),
                total: total
            });
            
            cart = []; updateCart(); toggleCart();
            UI.showToast('تم إرسال طلب التوريد بنجاح');
            setTimeout(() => window.location.href = 'index.html', 2000);
        }

        window.onload = () => {
            UI.initNeural();
            renderProducts();
        };
    </script>
</body>
</html>
