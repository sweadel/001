<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | B2B Catalog V126.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- SOVEREIGN CORE -->
    <script src="src/database.js"></script>
    <script src="src/security_core.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/ai_engine.js"></script>
    <script src="src/ui.js"></script>
</head>
<body class="rtl">
    <div class="cursor-glow" id="cursor"></div>
    <nav class="p-6 flex justify-between items-center glass sticky top-0 z-50">
        <a href="index.html" class="text-2xl font-black text-gold">ZOLNGEN</a>
        <div class="space-x-4 space-x-reverse">
            <a href="index.html" class="px-4 py-2 opacity-70 hover:opacity-100">Home</a>
            <a href="admin.html" class="px-4 py-2 bg-gold text-black rounded-lg font-bold">Admin</a>
        </div>
    </nav>

    <main class="p-10 max-w-7xl mx-auto">
        <header class="mb-12">
            <h1 class="text-6xl font-black text-gold gold-glow mb-4" data-i18n="product_catalog">B2B Catalog</h1>
            <p class="text-sm opacity-50 uppercase tracking-widest">Institutional Procurement & Supply Chain</p>
        </header>

        <!-- DYNAMIC PRODUCT GRID -->
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Rendered by ui.js -->
        </div>
    </main>

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX - 10, y: e.clientY - 10, duration: 0.1 });
        });
    </script>
</body>
</html>
