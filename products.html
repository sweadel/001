<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Catalog | V100.1 ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        .product-card:hover { transform: translateY(-10px); }
        .cart-drawer { position: fixed; left: 0; top: 0; width: 450px; height: 100vh; background: #050505; border-right: 1px solid rgba(212,175,55,0.2); z-index: 1000; transform: translateX(-100%); transition: 0.5s cubic-bezier(0.85, 0, 0.15, 1); }
        .cart-drawer.open { transform: translateX(0); }
    </style>
</head>
<body class="p-8">
    <canvas id="neural-bg"></canvas>

    <!-- Header -->
    <nav class="flex justify-between items-center max-w-7xl mx-auto mb-16">
        <a href="index.html" class="text-3xl font-black text-gold">ZOLNGEN <span class="text-white font-thin">CATALOG</span></a>
        <div class="flex gap-8 items-center">
            <input type="text" id="search-input" placeholder="البحث في الأجهزة..." class="bg-white/5 border border-white/10 px-6 py-3 rounded-full text-xs w-64 focus:border-gold outline-none" oninput="renderProducts()">
            <button onclick="toggleCart()" class="relative">
                <i class="fas fa-shopping-bag text-2xl text-gold"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-[8px] w-5 h-5 flex items-center justify-center rounded-full font-bold">0</span>
            </button>
        </div>
    </nav>

    <!-- Main -->
    <main class="max-w-7xl mx-auto">
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="cart-drawer glass p-10 flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <h3 class="text-2xl font-black">سلة التوريد</h3>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-white">إغلاق ×</button>
        </div>
        <div id="cart-items" class="flex-1 space-y-6 overflow-y-auto"></div>
        <div class="pt-10 border-t border-white/5 space-y-6">
            <div class="flex justify-between text-xl font-bold">
                <span>الإجمالي:</span>
                <span id="cart-total" class="text-gold">0 JOD</span>
            </div>
            <button onclick="checkout()" class="w-full btn-premium py-5 text-xl">تأكيد طلب التوريد</button>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="ui.js"></script>
    <script>
        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const q = document.getElementById('search-input').value.toLowerCase();
            const prods = DB.getProducts().filter(p => p.name.toLowerCase().includes(q));
            
            grid.innerHTML = prods.map(p => `
                <div class="glass p-6 rounded-[32px] border border-white/5 product-card transition-all">
                    <img src="${p.img}" class="w-full h-48 object-cover rounded-2xl mb-6 border border-white/5">
                    <h4 class="text-lg font-bold mb-2">${p.name}</h4>
                    <p class="text-gray-500 text-xs mb-6">${p.category}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-black text-gold">${p.price} JOD</span>
                        <button onclick="addToCart('${p.id}')" class="w-10 h-10 bg-gold text-dark rounded-full flex items-center justify-center hover:scale-110 transition-all"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = DB.getProducts().find(x => x.id === id);
            const existing = cart.find(x => x.id === id);
            if(existing) existing.qty++; else cart.push({...p, qty: 1});
            updateCart();
            UI.showToast(`تمت إضافة ${p.name}`);
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.reduce((a,b) => a+b.qty, 0);
            document.getElementById('cart-total').innerText = cart.reduce((a,b) => a+(b.price*b.qty), 0).toLocaleString() + ' JOD';
            
            container.innerHTML = cart.map(i => `
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-2xl">
                    <div class="text-xs">
                        <p class="font-bold">${i.name}</p>
                        <p class="text-gold">${i.price} JOD x ${i.qty}</p>
                    </div>
                    <button onclick="removeFromCart('${i.id}')" class="text-red-500">×</button>
                </div>
            `).join('');
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCart();
        }

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('open'); }

        function checkout() {
            if(!cart.length) return alert('السلة فارغة!');
            const entity = prompt('يرجى إدخال اسم المؤسسة لإتمام الطلب:', 'University of Jordan');
            if(!entity) return;
            
            const total = cart.reduce((a,b) => a+(b.price*b.qty), 0);
            DB.placeOrder({ entity, total, items: cart });
            cart = [];
            updateCart();
            toggleCart();
            UI.showToast('تم إرسال طلب التوريد بنجاح!');
        }

        window.onload = () => { UI.initNeural(); renderProducts(); };
    </script>
</body>
</html>
