<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | كتالوج التوريد V100.9</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(255, 255, 255, 0.03); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; cursor: none; }
        body { background: var(--dark); color: white; overflow-x: hidden; }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .cursor { position: fixed; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 1000; mix-blend-mode: difference; }
        input, select { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; padding: 1rem !important; border-radius: 1rem !important; }
        .cart-side { position: fixed; left: 0; top: 0; height: 100vh; width: 400px; z-index: 200; transform: translateX(-100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-side.open { transform: translateX(0); }
        .product-card { transition: all 0.5s ease; border: 1px solid rgba(255, 255, 255, 0.05); }
        .product-card:hover { border-color: var(--gold); transform: translateY(-10px); background: rgba(212, 175, 55, 0.02); }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <canvas id="neural-bg"></canvas>

    <nav class="fixed top-0 w-full z-[100] glass border-b border-white/5 py-8 px-12 flex justify-between items-center">
        <a href="index.html" class="text-3xl font-black text-gold gold-glow">ZOLNGEN <span class="text-[10px] block text-white/40 uppercase tracking-widest">Master Catalog</span></a>
        <div class="flex gap-10 items-center">
            <button onclick="toggleCart()" class="relative group">
                <i class="fas fa-shopping-cart text-xl group-hover:text-gold transition-all"></i>
                <span id="cart-count" class="absolute -top-3 -right-3 bg-gold text-dark text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
            <a href="index.html" class="text-xs font-bold uppercase tracking-widest opacity-60 hover:opacity-100">العودة للرئيسية</a>
        </div>
    </nav>

    <main class="pt-48 pb-20 container mx-auto px-12">
        <header class="mb-24">
            <h2 class="text-8xl font-black tracking-tighter mb-4">Enterprise Solutions</h2>
            <p class="text-gray-600 uppercase tracking-[0.4em] text-[10px] font-black">أحدث الأجهزة التقنية للمؤسسات الكبرى</p>
            
            <div class="mt-16 flex gap-6">
                <input type="text" id="search" placeholder="ابحث عن جهاز أو مواصفات..." oninput="renderProducts()" class="flex-1">
                <select id="cat-filter" onchange="renderProducts()" class="w-64">
                    <option value="all">كافة الفئات</option>
                    <option value="أجهزة محمولة">أجهزة محمولة</option>
                    <option value="خوادم">خوادم</option>
                    <option value="مكتبي">مكتبي</option>
                </select>
            </div>
        </header>

        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-12"></div>
    </main>

    <!-- CART SIDEBAR -->
    <div id="cart-sidebar" class="cart-side glass border-r border-white/5 p-12 flex flex-col shadow-2xl">
        <div class="flex justify-between items-center mb-16">
            <h3 class="text-4xl font-black text-gold tracking-tighter">سلة التوريد</h3>
            <button onclick="toggleCart()" class="text-3xl opacity-30 hover:opacity-100 transition-all">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto space-y-6"></div>
        <div class="mt-12 pt-10 border-t border-white/5">
            <div class="flex justify-between text-2xl font-black mb-10">
                <span class="text-gray-600 uppercase text-[10px] tracking-widest">Subtotal</span>
                <span id="cart-total" class="text-gold">0 JOD</span>
            </div>
            <button onclick="checkout()" class="w-full bg-gold text-dark py-6 rounded-2xl font-black text-xl shadow-2xl shadow-gold/20 hover:scale-105 transition-all">إرسال طلب التوريد</button>
        </div>
    </div>

    <script src="database.js"></script><script src="ui.js"></script><script src="auth.js"></script>
    <script>
        const cur = document.querySelector('.cursor');
        document.addEventListener('mousemove', e => { gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0.1 }); });

        let cart = [];
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const search = document.getElementById('search').value.toLowerCase();
            const cat = document.getElementById('cat-filter').value;
            const prods = DB.getProducts();

            const filtered = prods.filter(p => (p.name.toLowerCase().includes(search) || p.specs.toLowerCase().includes(search)) && (cat === 'all' || p.category === cat));
            
            grid.innerHTML = filtered.map(p => `
                <div class="product-card glass p-10 rounded-[64px] group">
                    <div class="h-64 flex items-center justify-center mb-10">
                        <img src="${p.img}" class="max-h-full object-contain group-hover:scale-110 transition-all duration-700 drop-shadow-2xl">
                    </div>
                    <div class="space-y-4">
                        <span class="text-[9px] font-black uppercase tracking-widest text-gold opacity-40">${p.category}</span>
                        <h4 class="text-2xl font-black">${p.name}</h4>
                        <p class="text-gray-600 text-xs leading-relaxed">${p.specs}</p>
                        <div class="flex justify-between items-center pt-10">
                            <span class="text-3xl font-black text-gold tracking-tighter">${p.price} JOD</span>
                            <button onclick="addToCart('${p.id}')" class="w-16 h-16 rounded-3xl bg-white/5 flex items-center justify-center hover:bg-gold hover:text-dark transition-all duration-500 shadow-xl"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('') || '<div class="col-span-full py-40 text-center opacity-30 text-2xl font-black">لا توجد نتائج</div>';
        }

        function addToCart(id) { cart.push(DB.getProducts().find(p => p.id === id)); updateCart(); UI.showToast('تمت الإضافة للمنظومة'); }
        function updateCart() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((p, i) => `
                <div class="flex justify-between items-center glass p-5 rounded-2xl border-white/5">
                    <div><p class="font-bold text-xs">${p.name}</p><p class="text-[9px] text-gold font-black mt-1">${p.price} JOD</p></div>
                    <button onclick="cart.splice(${i}, 1); updateCart();" class="text-red-500/30 hover:text-red-500 text-xl">&times;</button>
                </div>
            `).join('');
            document.getElementById('cart-total').innerText = cart.reduce((a,b) => a+b.price, 0) + ' JOD';
        }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }
        function checkout() {
            if(!cart.length) return UI.showToast('السلة فارغة');
            const s = Auth.getSession();
            if(!s) return UI.showToast('يرجى تسجيل الدخول أولاً');
            DB.placeOrder({ entity: s.name, items: cart.map(p => p.name), total: cart.reduce((a,b) => a+b.price, 0) });
            cart = []; updateCart(); toggleCart(); UI.showToast('تم إرسال الطلب بنجاح');
        }

        window.onload = () => { UI.initNeural(); renderProducts(); };
    </script>
</body>
</html>
