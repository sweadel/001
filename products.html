<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN Products | V107.0 GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="cursor"></div>
    <canvas id="neural-bg"></canvas>

    <nav class="fixed top-0 w-full z-[100] py-8 px-12 flex justify-between items-center glass border-b border-white/5">
        <div class="flex items-center gap-12">
            <h1 class="text-2xl font-black text-gold gold-glow">ZOLNGEN <span class="text-[8px] block text-white/30 uppercase tracking-[0.4em] font-black mt-1" data-i18n="subtitle">GLOBAL CATALOGUE</span></h1>
            <div class="hidden md:flex gap-8">
                <a href="index.html" class="text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100" data-i18n="home">Home</a>
                <a href="maintenance.html" class="text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100" data-i18n="maintenance">Maintenance</a>
            </div>
        </div>
        <button onclick="I18n.setLang(I18n.lang === 'ar' ? 'en' : 'ar')" class="text-[8px] border border-gold/40 text-gold px-3 py-1 rounded">AR / EN</button>
    </nav>

    <main class="pt-48 container mx-auto px-12 pb-20">
        <div class="flex justify-between items-end mb-16">
            <h2 class="text-5xl font-black tracking-tighter" data-i18n="products">Hardware Clusters</h2>
            <div class="glass px-6 py-2 rounded-xl"><span id="prod-count" class="text-gold font-black text-xl">0</span> <span class="text-[10px] text-gray-700 uppercase" data-i18n="inventory">Units Active</span></div>
        </div>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
    </main>

    <script src="database.js"></script><script src="i18n.js"></script>
    <script>
        const cur = document.querySelector('.cursor');
        document.addEventListener('mousemove', e => { gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0.1 }); });

        function renderProducts() {
            const prods = DB.getProducts();
            document.getElementById('prod-count').innerText = prods.length;
            const grid = document.getElementById('products-grid');
            grid.innerHTML = prods.map(p => `
                <div class="glass p-8 rounded-[40px] border border-white/5 card-omni hover:scale-105 transition-all text-center">
                    <div class="w-24 h-24 bg-white/2 rounded-full mx-auto mb-6 flex items-center justify-center"><i class="fas fa-server text-3xl text-gold/20"></i></div>
                    <h3 class="text-xl font-black mb-1">${p.name}</h3>
                    <p class="text-[8px] text-gray-800 uppercase tracking-widest mb-6">${p.category}</p>
                    <p class="text-2xl font-black text-gold mb-8">${p.price} JOD</p>
                    <button class="btn-gold w-full py-4 rounded-xl text-xs font-black">PROCURE UNIT</button>
                    ${p.ar_ready ? '<p class="mt-4 text-[7px] text-green-500 font-black uppercase tracking-widest"><i class="fas fa-vr-cardboard"></i> AR Ready</p>' : ''}
                </div>
            `).join('');
            gsap.from('.card-omni', { opacity: 0, y: 30, duration: 1, stagger: 0.1, ease: "power4.out" });
        }
        renderProducts();
        if(I18n.lang === 'en') { document.body.style.direction = 'ltr'; document.querySelectorAll('.text-right').forEach(el => { el.classList.remove('text-right'); el.classList.add('text-left'); }); }
    </script>
</body>
</html>
