<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | مركز الصيانة والدعم الفني</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-header { background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('category_desktops_luxury.png') center/cover; padding: 120px 0 80px; text-align: center; border-bottom: 1px solid var(--border-gold); }
        .page-header h1 { font-size: 3.5rem; color: var(--gold); margin-bottom: 15px; }
        .page-header p { color: #ccc; font-size: 1.2rem; max-width: 600px; margin: 0 auto; }
        .maintenance-wrapper { max-width: 800px; margin: -50px auto 100px; background: var(--surface); border: 1px solid var(--border-gold); border-radius: 20px; padding: 4rem; position: relative; z-index: 10; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="container top-bar-content">
            <div style="display: flex; gap: 2.5rem; align-items: center;">
                <a href="admin.html" style="color:inherit; text-decoration:none;"><i class="fas fa-lock"></i> نظام الإدارة Pro</a>
                <span>AR | EN</span>
            </div>
            <div style="display: flex; gap: 2rem; align-items: center;">
                <i class="fas fa-phone-alt" style="color:var(--gold);"></i> <span>+962 79 000 0000</span>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">
                <img src="zolngen_logo.png" style="height:55px;" onerror="this.src='https://ui-avatars.com/api/?name=Z&background=D4AF37&color=000'">
            </a>
            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="products.html">الكتالوج المؤسسي</a>
                <a href="maintenance.html" class="active">بوابة الصيانة</a>
                <a href="index.html#tracking">تتبع الطلب</a>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="container">
            <h1>مركز الدعم التقني والصيانة</h1>
            <p>نضمن استمرارية أعمال مؤسستكم من خلال صيانة فورية ومعتمدة لأجهزة ZOLNGEN.</p>
        </div>
    </div>

    <section class="container">
        <div class="maintenance-wrapper">
            <h2 style="font-size:2rem; margin-bottom:2rem; text-align:center; color:var(--gold);">فتح تذكرة صيانة رسمية</h2>
            <div class="ticket-form">
                <form id="maintenance-form-page">
                    <input type="text" id="m-entity-p" placeholder="الجهة المستفيدة / المؤسسة" required style="width:100%; padding:1.2rem; background:#000; border:1px solid #333; border-radius:12px; color:#fff; margin-bottom:1.5rem; outline:none;">
                    <select id="m-type-p" required style="width:100%; padding:1.2rem; background:#000; border:1px solid #333; border-radius:12px; color:#fff; margin-bottom:1.5rem; outline:none;">
                        <option value="">حدد المشكلة التقنية</option>
                        <option value="Hardware">عطل في القطع (Hardware)</option>
                        <option value="Software">مشكلة في النظام (Software)</option>
                        <option value="Network">أعطال في الشبكة</option>
                        <option value="Other">صيانة دورية</option>
                    </select>
                    <textarea id="m-issue-p" rows="6" placeholder="تفاصيل العطل والظواهر المرافقة..." required style="width:100%; padding:1.2rem; background:#000; border:1px solid #333; border-radius:12px; color:#fff; margin-bottom:2rem; outline:none; resize:none;"></textarea>
                    <button type="submit" class="btn btn-gold" style="width:100%; justify-content:center; padding:1.2rem; font-size:1.1rem;">إرسال طلب الصيانة</button>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container" style="text-align:center; color:#555;">
            جميع الحقوق محفوظة لشركة ZOLNGEN ENTERPRISE © 2024
        </div>
    </footer>

    <script src="database.js"></script>
    <script src="main.js"></script>
</body>
</html>
