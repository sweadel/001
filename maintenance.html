<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Support | V100.1 ULTIMATE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="p-8">
    <canvas id="neural-bg"></canvas>

    <nav class="flex justify-between items-center max-w-7xl mx-auto mb-16">
        <a href="index.html" class="text-3xl font-black text-gold">ZOLNGEN <span class="text-white font-thin">SUPPORT</span></a>
        <a href="index.html" class="text-gray-500 hover:text-white transition-all text-sm uppercase font-bold tracking-widest">الرئيسية</a>
    </nav>

    <main class="max-w-4xl mx-auto space-y-12">
        <div class="glass p-12 rounded-[48px] border border-white/5 animate-in">
            <h2 class="text-4xl font-black mb-8">فتح تذكرة <span class="text-gold">صيانة مؤسسية</span></h2>
            <form id="maint-form" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-gray-500 text-xs font-bold px-2">اسم المؤسسة</label>
                        <input type="text" id="maint-entity" required class="w-full" placeholder="مثلاً: جامعة العلوم والتكنولوجيا">
                    </div>
                    <div class="space-y-2">
                        <label class="text-gray-500 text-xs font-bold px-2">نوع الجهاز</label>
                        <input type="text" id="maint-type" required class="w-full" placeholder="مثلاً: خادم Dell PowerEdge">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-gray-500 text-xs font-bold px-2">وصف العطل أو المشكلة</label>
                    <textarea id="maint-issue" rows="4" required class="w-full" placeholder="يرجى كتابة تفاصيل المشكلة هنا..."></textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-gray-500 text-xs font-bold px-2">درجة الأهمية (SLA)</label>
                    <select id="maint-urgency" class="w-full">
                        <option value="Low">منخفضة - صيانة دورية</option>
                        <option value="Med">متوسطة - خلل جزئي</option>
                        <option value="High">حرجة - تعطل كلي للنظام</option>
                    </select>
                </div>
                <button type="submit" class="w-full btn-premium py-5 rounded-2xl shadow-2xl">إرسال البلاغ فوراً</button>
            </form>
        </div>

        <div id="tickets-history" class="space-y-6">
            <h3 class="text-2xl font-black mb-8">حالة التذاكر <span class="text-gold">الحالية</span></h3>
            <div id="tickets-list" class="space-y-4"></div>
        </div>
    </main>

    <script src="database.js"></script>
    <script src="ui.js"></script>
    <script>
        function renderTickets() {
            const list = document.getElementById('tickets-list');
            const tickets = DB.getTickets();
            list.innerHTML = tickets.map(t => `
                <div class="glass p-8 rounded-3xl border border-white/5 flex justify-between items-center hover:border-gold/30 transition-all">
                    <div>
                        <div class="flex items-center gap-3 mb-2">
                            <span class="text-gold font-black text-xs uppercase">${t.id}</span>
                            <span class="px-2 py-0.5 rounded bg-white/5 text-[8px] uppercase font-bold text-gray-400">${t.urgency}</span>
                        </div>
                        <h4 class="font-bold text-lg">${t.entity}</h4>
                        <p class="text-gray-500 text-xs">${t.type}</p>
                    </div>
                    <div class="text-left">
                        <span class="px-4 py-2 rounded-full text-[10px] font-black uppercase ${t.status === 'open' ? 'bg-red-500/10 text-red-500' : 'bg-green-500/10 text-green-500'}">${t.status}</span>
                        <p class="text-[8px] text-gray-700 mt-3">${t.date}</p>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-600 py-20">لا يوجد تذاكر نشطة حالياً</p>';
        }

        document.getElementById('maint-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                entity: document.getElementById('maint-entity').value,
                type: document.getElementById('maint-type').value,
                issue: document.getElementById('maint-issue').value,
                urgency: document.getElementById('maint-urgency').value
            };
            DB.createTicket(data);
            UI.showToast('تم فتح التذكرة بنجاح');
            e.target.reset();
            renderTickets();
        });

        window.onload = () => { UI.initNeural(); renderTickets(); };
    </script>
</body>
</html>
