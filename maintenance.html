<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN Support | V107.0 GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="cursor"></div>
    <canvas id="neural-bg"></canvas>

    <nav class="fixed top-0 w-full z-[100] py-8 px-12 flex justify-between items-center glass border-b border-white/5">
        <div class="flex items-center gap-12">
            <h1 class="text-2xl font-black text-gold">ZOLNGEN <span class="text-[8px] block text-white/30 uppercase tracking-[0.4em] font-black mt-1" data-i18n="subtitle">SUPPORT HUB</span></h1>
            <div class="hidden md:flex gap-8">
                <a href="index.html" class="text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100" data-i18n="home">Home</a>
                <a href="products.html" class="text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100" data-i18n="products">Products</a>
            </div>
        </div>
        <button onclick="I18n.setLang(I18n.lang === 'ar' ? 'en' : 'ar')" class="text-[8px] border border-gold/40 text-gold px-3 py-1 rounded">AR / EN</button>
    </nav>

    <main class="pt-48 container mx-auto px-12 max-w-4xl text-center">
        <h2 class="text-6xl font-black mb-6 tracking-tighter" data-i18n="maintenance">Technician Portal</h2>
        <p class="text-gray-700 text-lg mb-16 max-w-lg mx-auto" data-i18n="hero_desc">Log institutional hardware for servicing, repair, or lifecycle auditing.</p>
        
        <div class="glass p-12 rounded-[50px] border border-gold/10 text-right">
            <form class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="text" placeholder="Hardware Model ID" class="text-sm">
                    <input type="text" placeholder="Entity ID" class="text-sm">
                </div>
                <textarea placeholder="Diagnostic Description..." rows="4" class="text-sm"></textarea>
                <button type="button" class="btn-gold w-full py-5 rounded-2xl font-black text-lg shadow-xl shadow-gold/10">SUBMIT PROTOCOL</button>
            </form>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script>
        const cur = document.querySelector('.cursor');
        document.addEventListener('mousemove', e => { gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0.1 }); });
        if(I18n.lang === 'en') { document.body.style.direction = 'ltr'; document.querySelectorAll('.text-right').forEach(el => { el.classList.remove('text-right'); el.classList.add('text-left'); }); }
    </script>
</body>
</html>
