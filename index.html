<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | SOVEREIGN OS V130.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- ZOLNGEN SOVEREIGN CORE (AUDITED PATHS) -->
    <script src="src/database.js"></script>
    <script src="src/security_core.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/ai_engine.js"></script>
    <script src="src/ui.js"></script>
</head>
<body class="rtl">
    <div class="cursor-glow" id="cursor"></div>
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-adjust"></i></button>

    <main class="min-h-screen flex flex-center flex-col p-10">
        <div class="text-center mb-16">
            <h1 class="text-9xl font-black text-gold gold-glow mb-4">ZOLNGEN</h1>
            <p class="text-xl opacity-60 tracking-[0.5em] uppercase">Sovereign Singularity</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 w-full max-w-5xl">
            <a href="admin.html" class="glass-card text-center hover:scale-105 transition-slow">
                <i class="fas fa-user-shield text-6xl text-gold mb-8"></i>
                <h2 class="text-3xl font-bold mb-4" data-i18n="admin_portal">Admin Portal</h2>
                <p class="text-xs opacity-40 uppercase tracking-widest">Command & Control</p>
            </a>
            <a href="products.html" class="glass-card text-center hover:scale-105 transition-slow">
                <i class="fas fa-shopping-cart text-6xl text-gold mb-8"></i>
                <h2 class="text-3xl font-bold mb-4" data-i18n="product_catalog">B2B Catalog</h2>
                <p class="text-xs opacity-40 uppercase tracking-widest">Asset Management</p>
            </a>
        </div>
    </main>

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX - 12, y: e.clientY - 12, duration: 0.1 });
        });
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('zolngen_theme', target);
        }
    </script>
</body>
</html>
