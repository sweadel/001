<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN Enterprise | V100.4 MASTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        #mobile-menu { transform: translateY(-100%); transition: 0.5s cubic-bezier(0.85, 0, 0.15, 1); }
        #mobile-menu.open { transform: translateY(0); }
    </style>
</head>
<body class="overflow-x-hidden">
    <canvas id="neural-bg"></canvas>

    <!-- Navigation -->
    <nav class="fixed w-full z-[1000] p-6 lg:p-10">
        <div class="max-w-7xl mx-auto glass rounded-full px-8 py-4 flex justify-between items-center border border-white/5">
            <a href="index.html" class="text-2xl font-black text-gold tracking-tighter">ZOLNGEN <span class="text-white font-thin">PRO</span></a>
            <div class="hidden lg:flex gap-12 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-400">
                <a href="products.html" class="hover:text-gold transition-all">المنتجات</a>
                <a href="maintenance.html" class="hover:text-gold transition-all">الصيانة</a>
                <a href="admin.html" class="hover:text-gold transition-all">الإدارة</a>
            </div>
            <div class="flex gap-4 items-center">
                <button id="login-btn" onclick="UI.toggleLogin()" class="bg-white/5 border border-white/10 px-6 py-2 rounded-full text-[10px] font-bold uppercase hover:bg-gold hover:text-dark transition-all">دخول</button>
                <button onclick="toggleMobileMenu()" class="lg:hidden text-gold text-xl"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="fixed inset-0 z-[999] bg-black/95 backdrop-blur-3xl flex flex-col items-center justify-center space-y-8 lg:hidden">
        <a href="products.html" class="text-3xl font-black text-white hover:text-gold">المنتجات</a>
        <a href="maintenance.html" class="text-3xl font-black text-white hover:text-gold">الصيانة</a>
        <a href="admin.html" class="text-3xl font-black text-white hover:text-gold">الإدارة</a>
        <button onclick="toggleMobileMenu()" class="mt-12 text-gold"><i class="fas fa-times text-4xl"></i></button>
    </div>

    <!-- Hero -->
    <section class="h-screen flex items-center justify-center text-center p-6 relative">
        <div class="space-y-12 animate-in relative z-10">
            <div class="inline-block px-6 py-2 glass rounded-full border border-gold/20 text-[10px] font-bold text-gold uppercase tracking-widest mb-6">Institutional Excellence V100.4</div>
            <h1 class="text-5xl lg:text-[120px] font-black leading-none tracking-tighter">THE <span class="text-gold">MASTER</span><br>SYSTEM.</h1>
            <p class="max-w-xl mx-auto text-gray-500 text-sm lg:text-lg font-light leading-relaxed">منظومة ZOLNGEN المتكاملة لإدارة التوريد والخدمات اللوجستية للمؤسسات الحكومية والخاصة.</p>
            <div class="flex flex-col sm:flex-row gap-6 justify-center pt-8">
                <a href="products.html" class="bg-gold text-dark px-12 py-5 rounded-full font-black text-sm shadow-2xl shadow-gold/20 hover:scale-105 transition-all">تصفح الأجهزة</a>
                <a href="maintenance.html" class="glass border border-white/10 px-12 py-5 rounded-full font-black text-sm hover:bg-white/5 transition-all">طلب صيانة</a>
            </div>
        </div>
    </section>

    <!-- Bot & Login Widgets -->
    <div id="bot-widget" class="fixed bottom-10 left-10 z-[500] hidden">
        <div class="glass w-[350px] h-[500px] rounded-[40px] flex flex-col overflow-hidden border border-gold/20 shadow-2xl">
            <div class="p-6 bg-gold text-dark flex justify-between items-center">
                <span class="font-black">Antigravity AI</span>
                <button onclick="UI.toggleBot()" class="opacity-50 hover:opacity-100">×</button>
            </div>
            <div id="bot-messages" class="flex-1 p-6 overflow-y-auto space-y-4 text-xs"></div>
            <div class="p-6 border-t border-white/5 flex gap-2">
                <input type="text" id="bot-input" placeholder="اسأل عن المبيعات أو المخزون..." class="flex-1 bg-white/5 p-4 rounded-xl border border-white/10 outline-none">
                <button onclick="handleBotChat()" class="bg-gold text-dark w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <button onclick="UI.toggleBot()" class="fixed bottom-10 left-10 w-16 h-16 bg-gold text-dark rounded-2xl flex items-center justify-center text-2xl shadow-2xl hover:scale-110 transition-all z-[499]"><i class="fas fa-robot"></i></button>

    <div id="login-modal" class="fixed inset-0 z-[2000] bg-black/95 backdrop-blur-3xl hidden flex items-center justify-center p-6">
        <div class="glass p-12 rounded-[48px] max-w-sm w-full border border-gold/30 text-center">
            <h3 class="text-3xl font-black mb-8">تسجيل الدخول</h3>
            <input type="text" id="login-user" placeholder="اسم المستخدم" class="w-full mb-4">
            <input type="password" id="login-pass" placeholder="كلمة المرور" class="w-full mb-8">
            <button onclick="attemptLogin()" class="w-full bg-gold text-dark py-4 rounded-xl font-black mb-4">دخول آمن</button>
            <button onclick="UI.toggleLogin()" class="text-gray-500 text-xs hover:text-white">إلغاء</button>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="auth.js"></script>
    <script src="bot.js"></script>
    <script src="ui.js"></script>
    <script>
        function toggleMobileMenu() { document.getElementById('mobile-menu').classList.toggle('open'); }
        
        function attemptLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(Auth.login(u, p)) {
                UI.showToast('تم الدخول بنجاح');
                setTimeout(() => window.location.href = (Auth.getSession().role === 'ADMIN' ? 'admin.html' : 'client-dashboard.html'), 1000);
            } else {
                UI.showToast('بيانات غير صحيحة');
            }
        }

        function handleBotChat() {
            const input = document.getElementById('bot-input');
            const box = document.getElementById('bot-messages');
            if(!input.value) return;
            box.innerHTML += `<div class="text-right text-gold font-bold">أنت: ${input.value}</div>`;
            const reply = Bot.process(input.value);
            box.innerHTML += `<div class="bg-white/5 p-3 rounded-2xl">ZOLNGEN: ${reply}</div>`;
            input.value = ''; box.scrollTop = box.scrollHeight;
        }

        window.onload = () => { UI.initNeural(); };
    </script>
</body>
</html>
