<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | THE RADICAL V118.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="rtl">
    <div class="cursor-glow" id="cursor"></div>
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-adjust"></i></button>

    <main class="min-h-screen flex flex-col items-center justify-center p-10">
        <h1 class="text-8xl font-black text-gold gold-glow mb-6">ZOLNGEN</h1>
        <p class="text-xl opacity-70 tracking-widest uppercase mb-12">Institutional Singularity</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
            <a href="admin.html" class="glass p-12 rounded-[50px] text-center hover:scale-105 transition-all border-gold/20">
                <i class="fas fa-user-shield text-5xl text-gold mb-6"></i>
                <h2 class="text-2xl font-bold mb-4" data-i18n="admin_portal">Admin Portal</h2>
                <p class="text-xs opacity-50 uppercase tracking-tighter">Authorized Personnel Only</p>
            </a>
            <a href="products.html" class="glass p-12 rounded-[50px] text-center hover:scale-105 transition-all border-gold/20">
                <i class="fas fa-shopping-cart text-5xl text-gold mb-6"></i>
                <h2 class="text-2xl font-bold mb-4" data-i18n="product_catalog">B2B Catalog</h2>
                <p class="text-xs opacity-50 uppercase tracking-tighter">Institutional Procurement</p>
            </a>
        </div>
    </main>

    <script src="i18n.js"></script>
    <script>
        // CURSOR LOGIC
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX - 10, y: e.clientY - 10, duration: 0.1 });
        });

        // THEME LOGIC
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('zolngen_theme', target);
        }
        
        const savedTheme = localStorage.getItem('zolngen_theme');
        if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
