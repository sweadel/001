<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | Enterprise Pro V145.0</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="src/database.js"></script>
    <script src="src/ui.js"></script>
</head>
<body class="rtl bg-[#050505] text-white">
    <div id="cursor"></div>

    <nav class="fixed top-0 inset-x-0 z-[100] p-8 flex justify-between items-center glass">
        <h1 class="text-3xl font-black text-gold tracking-tighter">ZOLNGEN</h1>
        <div class="flex items-center gap-10">
            <a href="index.html" class="text-gold font-bold">Store</a>
            <a href="contact.html" class="opacity-50 hover:opacity-100 transition-all font-bold">Support</a>
            <button onclick="toggleCart()" class="relative"><i class="fas fa-shopping-bag"></i><span id="cart-count" class="absolute -top-2 -right-2 bg-gold text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span></button>
        </div>
    </nav>

    <header class="h-screen flex flex-col items-center justify-center text-center px-10">
        <h2 class="text-[80px] lg:text-[120px] font-black mb-6 tracking-tighter gold-glow animate-fade-up">ZOLNGEN</h2>
        <p class="text-gold opacity-50 uppercase tracking-[15px] text-xs lg:text-sm animate-fade-up">Professional Hardware Registry</p>
    </header>

    <main class="max-w-7xl mx-auto px-10 pb-40">
        <div id="store-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="col-span-full py-40 text-center opacity-20"><i class="fas fa-spinner animate-spin text-4xl"></i></div>
        </div>
    </main>

    <footer class="bg-[#0A0A0A] border-t border-white/5 py-20 text-center">
        <p class="opacity-30 text-[10px] uppercase font-black tracking-[10px] mb-8">&copy; 2026 ZOLNGEN ENTERPRISE</p>
        <div class="flex justify-center gap-10 opacity-40 text-xs">
            <a href="admin.html">Admin Console</a>
            <a href="contact.html">Support</a>
        </div>
    </footer>

    <!-- CART DRAWER -->
    <div id="cart-drawer" class="fixed inset-y-0 left-0 w-[400px] bg-[#0A0A0A] z-[500] border-r border-white/5 p-12 translate-x-[-100%] transition-transform duration-500 shadow-2xl">
        <div class="flex justify-between items-center mb-10"><h3 class="text-3xl font-black">Cart</h3><button onclick="toggleCart()">&times;</button></div>
        <div id="cart-items" class="space-y-6 mb-10"></div>
        <div class="border-t border-white/5 pt-10">
            <div class="flex justify-between text-2xl font-black mb-8"><span>Total</span><span id="cart-total">$0</span></div>
            <button onclick="checkout()" id="checkout-btn" class="w-full bg-gold text-black py-4 rounded-xl font-bold">Checkout</button>
        </div>
    </div>

    <script>
        let cart = [];
        async function initStore() {
            try {
                const products = await ZolngenDB.getProducts();
                const grid = document.getElementById('store-grid');
                if(!products || products.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center opacity-20">Registry is currently empty.</div>';
                    return;
                }
                grid.innerHTML = products.map(p => `
                    <div class="glass p-10 rounded-[50px] border border-white/5 hover:border-gold/30 transition-all group">
                        <h3 class="text-2xl font-black text-gold mb-2">${p.name}</h3>
                        <p class="text-[10px] opacity-40 uppercase tracking-widest mb-10">${p.sku}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-3xl font-black">$${p.price.toLocaleString()}</span>
                            <div class="flex gap-4">
                                <a href="details.html?id=${p.id}" class="p-4 bg-white/5 rounded-2xl hover:text-gold transition-all"><i class="fas fa-expand"></i></a>
                                <button onclick="addToCart(${JSON.stringify(p).replace(/"/g, '&quot;')})" class="p-4 bg-gold text-black rounded-2xl hover:scale-110 transition-all shadow-xl"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                    </div>
                `).join('');
                gsap.from("#store-grid > div", { opacity: 0, y: 30, stagger: 0.1, duration: 0.8 });
            } catch(e) { console.error("Store Init Failed:", e); }
        }

        function addToCart(p) { cart.push(p); updateCartUI(); ZolngenUI.showToast("Added to cart"); }
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('cart-items').innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center">
                    <div><h4 class="font-bold">${item.name}</h4><p class="text-xs opacity-40">$${item.price.toLocaleString()}</p></div>
                    <button onclick="removeFromCart(${idx})" class="text-red-500 opacity-20 hover:opacity-100"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            document.getElementById('cart-total').innerText = `$${cart.reduce((s, i) => s + i.price, 0).toLocaleString()}`;
        }
        function removeFromCart(i) { cart.splice(i, 1); updateCartUI(); }
        function toggleCart() {
            const d = document.getElementById('cart-drawer');
            d.style.transform = d.style.transform === 'translateX(0%)' ? 'translateX(-100%)' : 'translateX(0%)';
        }
        async function checkout() {
            if(cart.length === 0) return;
            const btn = document.getElementById('checkout-btn');
            btn.innerText = "Processing...";
            if(await ZolngenDB.placeOrder({ customer: "Store Customer", total: cart.reduce((s,i)=>s+i.price,0) })) {
                cart = []; updateCartUI(); toggleCart(); ZolngenUI.showToast("Order placed successfully");
                btn.innerText = "Checkout";
            }
        }
        initStore();
    </script>
</body>
</html>
