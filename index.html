<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | V105.0 GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(255, 255, 255, 0.03); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; cursor: none; scrollbar-width: none; }
        body { background: var(--dark); color: white; overflow-x: hidden; }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; }
        .glass { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .cursor { position: fixed; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 1000; mix-blend-mode: difference; }
        .btn-gold { background: var(--gold); color: var(--dark); font-weight: 900; transition: all 0.4s; }
        .btn-gold:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2); }
        .lang-toggle { cursor: pointer; font-size: 10px; font-weight: 900; color: var(--gold); border: 1px solid var(--gold); padding: 4px 10px; border-radius: 6px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .floating { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <canvas id="neural-bg"></canvas>

    <nav class="fixed top-0 w-full z-[100] py-8 px-12 flex justify-between items-center glass border-b border-white/5">
        <div class="flex items-center gap-12">
            <h1 class="text-3xl font-black text-gold gold-glow">ZOLNGEN <span class="text-[9px] block text-white/30 uppercase tracking-[0.4em] font-black mt-1" data-i18n="subtitle">GLOBAL STANDARD</span></h1>
            <div class="hidden md:flex gap-8">
                <a href="products.html" class="text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100" data-i18n="products">المنتجات</a>
                <a href="maintenance.html" class="text-[10px] font-black uppercase tracking-widest opacity-60 hover:opacity-100" data-i18n="maintenance">الصيانة</a>
                <a href="admin.html" id="admin-link" class="text-[10px] font-black uppercase tracking-widest text-gold hidden" data-i18n="admin">الإدارة</a>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <button onclick="I18n.setLang(I18n.lang === 'ar' ? 'en' : 'ar')" class="lang-toggle">AR / EN</button>
            <button id="login-btn" onclick="openLogin()" class="btn-gold px-8 py-3 rounded-full text-[10px] uppercase tracking-widest" data-i18n="login">دخول</button>
        </div>
    </nav>

    <main class="pt-60 container mx-auto px-12">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-24 items-center">
            <div class="space-y-10">
                <div class="inline-block glass px-6 py-2 rounded-full border-gold/20">
                    <p class="text-gold text-[9px] font-black uppercase tracking-[0.3em]">Institutional Standard V105.0</p>
                </div>
                <h2 class="text-7xl font-black leading-[0.9] tracking-tighter" data-i18n="hero_title">إعادة تعريف القوة المؤسسية</h2>
                <p class="text-gray-500 text-lg max-w-lg leading-relaxed" data-i18n="hero_desc">المنظومة الأكثر تقدماً في توريد وإدارة التكنولوجيا للشركات الكبرى.</p>
                <div class="flex gap-6">
                    <button onclick="location.href='products.html'" class="btn-gold px-12 py-5 rounded-2xl text-lg font-black" data-i18n="explore">استكشف الحلول</button>
                    <button class="glass px-12 py-5 rounded-2xl text-lg font-black hover:bg-white/5 transition-all" data-i18n="contact">تواصل معنا</button>
                </div>
            </div>
            <div class="relative flex justify-center items-center">
                <div class="absolute w-[500px] h-[500px] bg-gold/5 rounded-full blur-3xl"></div>
                <img src="images/hp.png" class="relative z-10 w-[80%] floating drop-shadow-2xl">
            </div>
        </div>
    </main>

    <!-- MODAL: LOGIN -->
    <div id="modal-bg" class="fixed inset-0 z-[300] bg-black/95 backdrop-blur-3xl hidden flex items-center justify-center p-6">
        <div id="login-modal" class="glass p-12 rounded-[50px] max-w-sm w-full border border-gold/30 text-center hidden">
            <h3 class="text-3xl font-black mb-8 text-gold" data-i18n="admin_gate">بوابة الإدارة</h3>
            <div class="space-y-4">
                <input type="text" id="user" data-i18n="username" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none">
                <input type="password" id="pass" data-i18n="password" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none">
            </div>
            <button onclick="handleLogin()" class="btn-gold w-full py-5 rounded-2xl mt-8 shadow-xl shadow-gold/10" data-i18n="secure_access">دخول آمن</button>
            <button onclick="closeLogin()" class="mt-4 text-gray-600 text-xs hover:text-white underline" data-i18n="cancel">إلغاء</button>
        </div>
    </div>

    <!-- BOT UI -->
    <div id="bot-ui" class="fixed bottom-10 right-10 z-[200]">
        <button onclick="toggleBot()" class="w-20 h-20 bg-gold text-dark rounded-full shadow-2xl flex items-center justify-center text-3xl hover:scale-110 transition-all shadow-gold/20"><i class="fas fa-robot"></i></button>
        <div id="bot-box" class="absolute bottom-24 right-0 w-[380px] h-[500px] glass rounded-[40px] border border-gold/10 hidden flex flex-col p-8">
            <div class="flex items-center gap-4 mb-6 border-b border-white/5 pb-4">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-lg shadow-green-500/50"></div>
                <span class="font-black text-gold text-xs">Antigravity V105.0 Online</span>
            </div>
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pr-4 text-xs"></div>
            <div class="mt-6 flex gap-4">
                <input type="text" id="bot-input" placeholder="..." class="flex-1 bg-white/5 border border-white/10 p-4 rounded-xl text-white outline-none">
                <button onclick="askBot()" class="bg-gold text-dark p-4 rounded-xl"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script src="auth.js"></script>
    <script src="ui.js"></script>
    <script src="i18n.js"></script>
    <script src="bot.js"></script>
    <script src="index.js"></script>
    <script>
        const cur = document.querySelector('.cursor');
        document.addEventListener('mousemove', e => { gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0.1 }); });
        function toggleBot() { document.getElementById('bot-box').classList.toggle('hidden'); }
        function askBot() {
            const i = document.getElementById('bot-input');
            const b = document.getElementById('chat-box');
            if(!i.value) return;
            b.innerHTML += `<div class="bg-white/5 p-4 rounded-2xl ml-8"><p class="font-black text-[8px] opacity-40 mb-1">YOU</p><p>${i.value}</p></div>`;
            const r = Bot.process(i.value);
            setTimeout(() => {
                b.innerHTML += `<div class="bg-gold/10 p-4 rounded-2xl mr-8 border border-gold/20"><p class="font-black text-[8px] text-gold mb-1">ANTIGRAVITY</p><p>${r}</p></div>`;
                b.scrollTop = b.scrollHeight;
            }, 600);
            i.value = '';
        }
    </script>
</body>
</html>
