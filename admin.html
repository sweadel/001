<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN Admin | SOVEREIGN OS V125.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- SOVEREIGN CORE -->
    <script src="src/database.js"></script>
    <script src="src/security_core.js"></script>
    <script src="src/i18n.js"></script>
    <script src="src/ai_engine.js"></script>
</head>
<body class="rtl overflow-hidden">
    <div class="cursor-glow" id="cursor"></div>
    <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-adjust"></i></button>

    <div id="admin-lock-screen" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6">
        <div class="glass p-16 rounded-[60px] text-center border-gold/20 max-w-sm w-full">
            <h2 class="text-4xl font-black text-gold gold-glow mb-12">Authorized Entry</h2>
            <div class="space-y-4">
                <input type="text" id="lock-user" placeholder="User ID" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center outline-none focus:border-gold">
                <input type="password" id="lock-pass" placeholder="Security Protocol" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-center outline-none focus:border-gold">
            </div>
            <button onclick="unlockAdmin()" class="btn-gold w-full mt-10 shadow-2xl">Access Core</button>
        </div>
    </div>

    <div id="admin-content" class="hidden h-screen flex">
        <aside class="w-[300px] glass p-10 flex flex-col border-l border-gold/10">
            <h1 class="text-2xl font-black text-gold mb-12">ZOLNGEN ADMIN</h1>
            <nav class="flex-1 space-y-2">
                <button onclick="switchTab('dash')" class="w-full text-right p-4 hover:bg-gold/5 rounded-xl font-bold flex items-center gap-4"><i class="fas fa-th-large w-4"></i> Dashboard</button>
                <button onclick="switchTab('inv')" class="w-full text-right p-4 hover:bg-gold/5 rounded-xl font-bold flex items-center gap-4"><i class="fas fa-boxes w-4"></i> Inventory</button>
            </nav>
            <button onclick="Auth.logout()" class="p-4 bg-red-500/10 text-red-500 rounded-xl font-bold mt-auto border border-red-500/20">Terminate</button>
        </aside>

        <main class="flex-1 p-[60px] overflow-y-auto">
            <div id="tab-dash" class="tab-content">
                <h2 class="text-5xl font-black text-gold gold-glow mb-10">Institutional Pulse</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="glass p-8 rounded-3xl border-b-4 border-gold/40"><p class="text-[10px] uppercase opacity-50 mb-2">Total Sales</p><h3 id="stat-sales" class="text-3xl font-black text-gold">0</h3></div>
                    <div class="glass p-8 rounded-3xl border-b-4 border-green-500/40"><p class="text-[10px] uppercase opacity-50 mb-2">System Health</p><h3 class="text-3xl font-black text-green-500">OPTIMAL</h3></div>
                </div>
                <div class="glass p-10 rounded-[40px] border border-gold/10"><canvas id="forecastChart" height="100"></canvas></div>
            </div>
        </main>
    </div>

    <script>
        // CURSOR LOGIC
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX - 10, y: e.clientY - 10, duration: 0.1 });
        });

        // THEME LOGIC
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('zolngen_theme', target);
        }
        
        const savedTheme = localStorage.getItem('zolngen_theme');
        if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
        }

        function unlockAdmin() {
            // Simulated Unlock for demonstration
            document.getElementById('admin-lock-screen').classList.add('hidden');
            document.getElementById('admin-content').classList.remove('hidden');
            SecurityCore.logAction("ADMIN_LOGIN", "Authorized access granted.");
        }
    </script>
</body>
</html>
