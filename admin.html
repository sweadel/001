<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | Sovereign Admin V144.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="src/database.js"></script>
    <script src="src/ui.js"></script>
</head>
<body class="rtl bg-[#050505] text-white">
    <div id="cursor"></div>

    <!-- MOBILE OVERLAY -->
    <div class="lg:hidden fixed top-0 inset-x-0 bg-[#0A0A0A] p-6 z-[200] border-b border-white/5 flex justify-between items-center">
        <h1 class="text-xl font-black text-gold">ZOLNGEN PRO</h1>
        <button onclick="toggleMobileMenu()" class="text-gold text-2xl"><i class="fas fa-bars"></i></button>
    </div>

    <!-- AUTH -->
    <div id="login-screen" class="fixed inset-0 z-[1000] bg-black flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[40px] border border-white/5 w-full max-w-sm text-center">
            <h2 class="text-3xl font-black text-gold mb-10">Command Entry</h2>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="User" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="password" id="pass" placeholder="Pass" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            </div>
            <button onclick="handleLogin()" class="w-full mt-8 bg-gold text-black py-4 rounded-xl font-black">Authenticate</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="main-dash" class="hidden flex h-screen overflow-hidden">
        <aside id="sidebar" class="w-[280px] bg-[#0A0A0A] border-l border-white/5 flex flex-col fixed inset-y-0 right-0 z-[150] translate-x-[100%] lg:translate-x-0 transition-transform duration-300">
            <div class="p-10 text-center font-black text-gold text-2xl">ZOLNGEN</div>
            <nav class="flex-1 px-4 space-y-1">
                <button onclick="switchTab('dash')" class="w-full text-right p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 transition-all"><i class="fas fa-chart-pie"></i> Pulse</button>
                <button onclick="switchTab('inv')" class="w-full text-right p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 transition-all"><i class="fas fa-box"></i> Inventory</button>
                <button onclick="switchTab('orders')" class="w-full text-right p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 transition-all"><i class="fas fa-shopping-cart"></i> Orders</button>
                <button onclick="switchTab('inquiries')" class="w-full text-right p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 transition-all"><i class="fas fa-envelope"></i> Support</button>
                <button onclick="switchTab('heal')" class="w-full text-right p-4 hover:bg-white/5 rounded-xl flex items-center gap-4 transition-all text-blue-400"><i class="fas fa-heartbeat"></i> Healer</button>
            </nav>
            <div class="p-8 border-t border-white/5"><button onclick="logout()" class="text-red-500 font-bold">Logout</button></div>
        </aside>

        <main class="flex-1 lg:mr-[280px] p-6 lg:p-20 overflow-y-auto mt-20 lg:mt-0">
            <!-- DASHBOARD TAB -->
            <div id="tab-dash" class="tab-content">
                <h2 class="text-4xl lg:text-6xl font-black mb-10 lg:mb-16">Enterprise Pulse</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                    <div class="glass p-10 rounded-3xl border border-white/5"><p class="text-xs opacity-30 mb-2 uppercase">Assets</p><h3 id="stat-p" class="text-4xl font-black text-gold">0</h3></div>
                    <div class="glass p-10 rounded-3xl border border-white/5"><p class="text-xs opacity-30 mb-2 uppercase">Revenue</p><h3 id="stat-r" class="text-4xl font-black text-green-500">$0</h3></div>
                    <div class="glass p-10 rounded-3xl border border-white/5"><canvas id="distChart" height="200"></canvas></div>
                </div>
                <div class="glass p-10 rounded-[40px] border border-white/5"><canvas id="pulseChart" height="100"></canvas></div>
            </div>

            <!-- HEALER TAB -->
            <div id="tab-heal" class="tab-content hidden">
                <h2 class="text-5xl font-black mb-10">Sovereign Healer</h2>
                <div class="glass p-12 rounded-[50px] border border-blue-500/20 text-center">
                    <i class="fas fa-shield-virus text-7xl text-blue-500 mb-8 animate-pulse"></i>
                    <h3 class="text-2xl font-black mb-4">Integrity Monitoring</h3>
                    <p class="opacity-40 max-w-md mx-auto mb-10 text-sm">Perform a real-time check of all HTML, CSS, and API files to ensure system sovereignty and repair minor corruptions.</p>
                    <button onclick="runHealer()" id="heal-btn" class="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black hover:scale-105 transition-all">Execute Self-Repair</button>
                    <div id="heal-status" class="mt-10 font-mono text-xs opacity-30">Waiting for command...</div>
                </div>
            </div>

            <!-- OTHER TABS (Simplified placeholders for brevity) -->
            <div id="tab-inv" class="tab-content hidden"><h2 class="text-5xl font-black mb-10">Inventory</h2><div id="inv-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div>
            <div id="tab-orders" class="tab-content hidden"><h2 class="text-5xl font-black mb-10">Orders</h2><div class="glass rounded-3xl overflow-hidden"><table class="w-full text-right"><tbody id="order-list"></tbody></table></div></div>
            <div id="tab-inquiries" class="tab-content hidden"><h2 class="text-5xl font-black mb-10">Inquiries</h2><div id="inq-list" class="space-y-4"></div></div>
        </main>
    </div>

    <script>
        let pChart = null, dChart = null;
        function toggleMobileMenu() { document.getElementById('sidebar').classList.toggle('translate-x-[100%]'); }
        async function handleLogin() {
            if(await ZolngenDB.login(document.getElementById('user').value, document.getElementById('pass').value)) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dash').classList.remove('hidden');
                refreshAll();
            }
        }
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            if(window.innerWidth < 1024) toggleMobileMenu();
            refreshAll();
        }
        async function refreshAll() {
            const ps = await ZolngenDB.getProducts(), os = await ZolngenDB.getOrders(), inqs = await ZolngenDB.getInquiries();
            document.getElementById('stat-p').innerText = ps.length;
            document.getElementById('stat-r').innerText = `$${os.reduce((s,o)=>s+o.total,0).toLocaleString()}`;
            
            // Analytics
            const ctx1 = document.getElementById('pulseChart'), ctx2 = document.getElementById('distChart');
            if(pChart) pChart.destroy(); if(dChart) dChart.destroy();
            pChart = new Chart(ctx1, { type: 'line', data: { labels: os.map(o=>o.date.split('T')[0]), datasets: [{ label: 'Revenue', data: os.map(o=>o.total), borderColor: '#D4AF37', tension:0.4 }] } });
            dChart = new Chart(ctx2, { type: 'doughnut', data: { labels: ['Laptops', 'Desktops', 'Parts'], datasets: [{ data: [ps.filter(p=>p.name.includes('Laptop')).length, ps.filter(p=>p.name.includes('Desktop')).length, ps.filter(p=>!p.name.includes('Laptop')&&!p.name.includes('Desktop')).length], backgroundColor: ['#D4AF37', '#3b82f6', '#10b981'] }] }, options: { plugins: { legend: { display: false } } } });

            // Lists
            document.getElementById('inv-list').innerHTML = ps.map(p=>`<div class="glass p-6 rounded-2xl border border-white/5 flex justify-between"><div><h4 class="font-bold text-gold">${p.name}</h4><p class="text-xs opacity-40">$${p.price.toLocaleString()}</p></div></div>`).join('');
            document.getElementById('order-list').innerHTML = os.map(o=>`<tr class="border-t border-white/5"><td class="p-6 font-bold">${o.customer}</td><td class="p-6 text-gold">$${o.total.toLocaleString()}</td><td class="p-6 text-xs opacity-40">${o.status}</td></tr>`).join('');
            document.getElementById('inq-list').innerHTML = inqs.map(i=>`<div class="glass p-6 rounded-2xl border border-white/5"><p class="font-bold text-gold">${i.name}</p><p class="text-xs opacity-40">${i.message}</p></div>`).join('');
        }

        async function runHealer() {
            const btn = document.getElementById('heal-btn'), stat = document.getElementById('heal-status');
            btn.innerText = "Scanning Nodes..."; btn.disabled = true;
            const res = await fetch("/api/heal", { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('zolngen_auth_token')}` }, body: JSON.stringify({}) });
            const data = await res.json();
            setTimeout(() => {
                stat.innerText = `SYSTEM STATUS: ${data.status.toUpperCase()} | ALL PROTOCOLS VERIFIED.`;
                btn.innerText = "Execute Self-Repair"; btn.disabled = false;
                ZolngenUI.showToast("Sovereign Healing Complete", "success");
                refreshAll();
            }, 2000);
        }
        function logout() { localStorage.removeItem('zolngen_auth_token'); location.reload(); }
        window.refreshAll = refreshAll;
    </script>
</body>
</html>
