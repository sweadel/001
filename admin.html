<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN Admin | V105.0 GLOBAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(255, 255, 255, 0.03); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; cursor: none; scrollbar-width: none; }
        body { background: var(--dark); color: white; overflow-x: hidden; }
        #neural-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.1; }
        .glass { background: var(--glass); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.04); }
        .sidebar { width: 300px; height: 100vh; position: fixed; right: 0; top: 0; z-index: 200; border-left: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.5s; overflow-y: auto; }
        body.ltr .sidebar { right: auto; left: 0; border-left: none; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .main { margin-right: 300px; padding: 60px; min-height: 100vh; transition: all 0.5s; }
        body.ltr .main { margin-right: 0; margin-left: 300px; }
        .tab-btn { transition: all 0.3s; opacity: 0.25; border-radius: 12px; margin-bottom: 2px; font-size: 0.75rem; }
        .tab-btn.active { opacity: 1; color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .cursor { position: fixed; width: 4px; height: 4px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 1000; mix-blend-mode: difference; }
        .lang-toggle { cursor: pointer; font-size: 8px; font-weight: 900; color: var(--gold); border: 1px solid var(--gold); padding: 4px 8px; border-radius: 4px; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(100%); } body.ltr .sidebar { transform: translateX(-100%); } .main { margin-right: 0 !important; margin-left: 0 !important; padding: 25px; } }
    </style>
</head>
<body class="rtl">
    <div class="cursor"></div>
    <canvas id="neural-bg"></canvas>

    <!-- LOCK SCREEN -->
    <div id="admin-lock-screen" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6 text-center">
        <div class="glass p-12 rounded-[50px] max-w-sm w-full border border-gold/10">
            <h3 class="text-3xl font-black mb-1 text-gold" data-i18n="admin_gate">بوابة الإدارة</h3>
            <p class="text-gray-700 text-[8px] mb-10 uppercase tracking-[0.4em] font-black" data-i18n="secure_access">Secure Access</p>
            <div class="space-y-4">
                <input type="text" id="lock-user" data-i18n="username" class="text-center w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="password" id="lock-pass" data-i18n="password" onkeydown="if(event.key==='Enter') unlockAdmin()" class="text-center w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            </div>
            <button onclick="unlockAdmin()" class="btn-gold w-full py-4 rounded-xl font-black mt-10 bg-gold text-dark text-xs" data-i18n="login">دخول</button>
            <div class="mt-8"><button onclick="I18n.setLang(I18n.lang === 'ar' ? 'en' : 'ar')" class="lang-toggle">AR / EN</button></div>
        </div>
    </div>

    <!-- ADMIN CONTENT -->
    <div id="admin-content" class="hidden">
        <aside id="sidebar" class="sidebar glass p-8">
            <div class="mb-12">
                <h1 class="text-2xl font-black text-gold">ZOLNGEN <span class="text-[7px] block text-white/20 uppercase tracking-[0.5em] font-black mt-1" data-i18n="subtitle">V105.0 GLOBAL</span></h1>
            </div>
            <nav class="space-y-1">
                <button onclick="showTab('overview')" class="tab-btn active w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-radar w-4"></i> <span data-i18n="admin">نظرة عامة</span></button>
                <button onclick="showTab('supply')" class="tab-btn w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-microchip w-4"></i> <span data-i18n="inventory">المخزون</span></button>
                <button onclick="showTab('ops')" class="tab-btn w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-tasks w-4"></i> <span data-i18n="orders">العمليات</span></button>
                <button onclick="showTab('hr')" class="tab-btn w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-user-tie w-4"></i> <span data-i18n="hr">الكادر</span></button>
                <button onclick="showTab('crm')" class="tab-btn w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-handshake w-4"></i> <span data-i18n="crm">المؤسسات</span></button>
                <button onclick="showTab('security')" class="tab-btn w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-shield-virus w-4"></i> <span data-i18n="security">الأمن</span></button>
                <button onclick="showTab('settings')" class="tab-btn w-full text-right p-3 px-6 flex items-center gap-4 font-black"><i class="fas fa-cog w-4"></i> <span data-i18n="settings">الإعدادات</span></button>
            </nav>
            <div class="mt-12 pt-8 border-t border-white/5">
                <button onclick="I18n.setLang(I18n.lang === 'ar' ? 'en' : 'ar')" class="w-full lang-toggle mb-4 py-2">SWITCH LANGUAGE</button>
                <button onclick="Auth.logout()" class="w-full p-4 bg-red-500/10 text-red-500 rounded-xl text-[8px] font-black uppercase" data-i18n="logout">EXIT</button>
            </div>
        </aside>

        <main class="main">
            <header class="flex justify-between items-end mb-16">
                <div>
                    <h2 id="tab-title" class="text-5xl font-black tracking-tighter" data-i18n="admin_gate">Command Center</h2>
                    <p class="text-gray-700 uppercase tracking-[0.5em] text-[8px] font-black mt-2">GLOBAL INSTITUTIONAL ORCHESTRATOR</p>
                </div>
                <div class="text-right glass px-6 py-3 rounded-2xl border border-white/5">
                    <p id="admin-name" class="text-gold font-black text-sm">Overseer</p>
                    <small class="text-gray-800 text-[7px] uppercase font-black" data-i18n="secure_access">Secure Access</small>
                </div>
            </header>

            <section id="tab-overview" class="tab-content space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="glass p-8 rounded-3xl border-b-2 border-gold/40">
                        <p class="text-gray-700 text-[8px] uppercase font-black mb-1" data-i18n="stats_revenue">Revenue</p>
                        <h3 id="stat-sales" class="text-2xl font-black text-gold">0</h3>
                    </div>
                    <div class="glass p-8 rounded-3xl border-b-2 border-green-500/40">
                        <p class="text-gray-700 text-[8px] uppercase font-black mb-1" data-i18n="stats_profit">Profit</p>
                        <h3 id="stat-profit" class="text-2xl font-black text-green-500">0</h3>
                    </div>
                    <div class="glass p-8 rounded-3xl border-b-2 border-blue-500/40">
                        <p class="text-gray-700 text-[8px] uppercase font-black mb-1" data-i18n="stats_inventory">Assets</p>
                        <h3 id="stat-inv" class="text-2xl font-black text-blue-400">0</h3>
                    </div>
                    <div class="glass p-8 rounded-3xl border-b-2 border-purple-500/40">
                        <p class="text-gray-700 text-[8px] uppercase font-black mb-1" data-i18n="stats_health">Health</p>
                        <h3 class="text-2xl font-black text-purple-500">100% OK</h3>
                    </div>
                </div>
                <div class="glass p-10 rounded-[40px] border border-white/5">
                    <canvas id="forecastChart" height="120"></canvas>
                </div>
            </section>

            <section id="tab-supply" class="tab-content hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h3 class="text-3xl font-black" data-i18n="inventory">Supply Chain</h3>
                    <button onclick="openModal('prod-modal')" class="bg-gold text-dark px-10 py-3 rounded-xl font-black text-xs" data-i18n="add_product">Add Product</button>
                </div>
                <div class="glass rounded-[30px] overflow-hidden">
                    <table class="w-full text-right text-[11px]">
                        <thead class="bg-white/5 text-gray-700 uppercase font-black text-[8px]">
                            <tr><th class="p-6" data-i18n="products">Product</th><th class="p-6" data-i18n="category">Cat</th><th class="p-6" data-i18n="price">Price</th><th class="p-6" data-i18n="stock">Stock</th><th class="p-6" data-i18n="actions">Actions</th></tr>
                        </thead>
                        <tbody id="inv-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="tab-ops" class="tab-content hidden space-y-8">
                <h3 class="text-3xl font-black" data-i18n="orders">Operations</h3>
                <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>
            </section>
        </main>
    </div>

    <!-- MODALS -->
    <div id="modal-bg" class="fixed inset-0 z-[600] bg-black/98 backdrop-blur-3xl hidden flex items-center justify-center p-6">
        <div id="prod-modal" class="glass p-12 rounded-[50px] max-w-sm w-full border border-gold/10 hidden">
            <h3 class="text-2xl font-black mb-8 text-gold" data-i18n="add_product">Add Product</h3>
            <form id="prod-form" class="space-y-4">
                <input type="hidden" id="p-id"><input type="text" id="p-name" data-i18n="products" class="text-xs">
                <input type="text" id="p-cat" data-i18n="category" class="text-xs">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-price" data-i18n="price" class="text-xs">
                    <input type="number" id="p-stock" data-i18n="stock" class="text-xs">
                </div>
                <button type="submit" class="w-full bg-gold text-dark py-4 rounded-xl font-black mt-6" data-i18n="save">Sync</button>
                <button type="button" onclick="closeModal()" class="w-full text-gray-700 text-[10px] uppercase font-black mt-4" data-i18n="cancel">Cancel</button>
            </form>
        </div>
    </div>

    <script src="database.js"></script><script src="auth.js"></script><script src="ui.js"></script><script src="i18n.js"></script><script src="admin.js"></script>
    <script>
        const cur = document.querySelector('.cursor');
        document.addEventListener('mousemove', e => { gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0.1 }); });
        
        // V105.0 MASTER SYNC
        checkInit = () => {
            const s = Auth.getSession();
            if(s && s.role === 'ADMIN') {
                gsap.to('#admin-lock-screen', { opacity: 0, scale: 1.1, duration: 1, ease: "expo.out", onComplete: () => {
                    document.getElementById('admin-lock-screen').style.display = 'none';
                    document.getElementById('admin-content').classList.remove('hidden');
                    renderAdmin();
                }});
            }
        };

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            event.currentTarget.classList.add('active');
            renderAdmin();
        }

        function renderAdmin() {
            const stats = DB.getProStats();
            document.getElementById('stat-sales').innerText = stats.totalSales.toLocaleString() + ' JOD';
            document.getElementById('stat-profit').innerText = (stats.totalSales * 0.25).toLocaleString() + ' JOD';
            document.getElementById('stat-inv').innerText = stats.inventoryValue.toLocaleString() + ' JOD';

            // Inventory
            const invBody = document.getElementById('inv-body');
            invBody.innerHTML = DB.getProducts().map(p => `
                <tr class="border-b border-white/5 hover:bg-white/2 transition-all">
                    <td class="p-6 font-black">${p.name}</td>
                    <td class="p-6 text-gray-700 font-black uppercase text-[7px] tracking-widest">${p.category}</td>
                    <td class="p-6 text-gold font-black">${p.price} JOD</td>
                    <td class="p-6 font-mono text-[10px] ${p.stock < 10 ? 'text-red-500 font-black' : ''}">${p.stock}</td>
                    <td class="p-6 text-center">
                        <button onclick="editP('${p.id}')" class="text-gray-700 hover:text-gold mr-3"><i class="fas fa-edit"></i></button>
                        <button onclick="if(confirm('Terminate?')){DB.deleteProduct('${p.id}');renderAdmin();}" class="text-red-500/20 hover:text-red-500"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            // Orders
            document.getElementById('orders-grid').innerHTML = DB.getOrders().map(o => `
                <div class="glass p-6 rounded-3xl border border-white/5 text-xs">
                    <p class="font-black text-gold mb-2">${o.entity}</p>
                    <p class="text-gray-700 text-[8px] uppercase">${o.id} • ${o.date}</p>
                    <p class="mt-4 font-black">${o.total} JOD</p>
                </div>
            `).join('');

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('forecastChart');
            if(!ctx) return;
            const stats = DB.getProStats();
            if(window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ data: [stats.totalSales*0.2, stats.totalSales*0.5, stats.totalSales, stats.totalSales*1.9], borderColor: '#D4AF37', borderWidth: 1.5, tension: 0.5, fill: true, backgroundColor: 'rgba(212, 175, 55, 0.05)', pointRadius: 0 }] },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#333', font: { size: 7 } } } } }
            });
        }

        function openModal(id) { document.getElementById('modal-bg').classList.remove('hidden'); document.getElementById(id).classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal-bg').classList.add('hidden'); document.querySelectorAll('#modal-bg > div').forEach(d => d.classList.add('hidden')); }

        // BILINGUAL ADAPTATION
        if(I18n.lang === 'en') {
            document.body.classList.remove('rtl');
            document.body.classList.add('ltr');
            document.querySelectorAll('.text-right').forEach(el => { el.classList.remove('text-right'); el.classList.add('text-left'); });
        }
    </script>
</body>
</html>
