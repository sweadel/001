<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN Admin | V106.0 GRAND INTEGRATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="cursor"></div>
    <canvas id="neural-bg"></canvas>

    <!-- LOCK SCREEN -->
    <div id="admin-lock-screen" class="fixed inset-0 z-[500] bg-black flex items-center justify-center p-6 text-center">
        <div class="glass p-12 rounded-[50px] max-w-sm w-full border border-gold/10">
            <h3 class="text-3xl font-black mb-1 text-gold" data-i18n="admin_gate">بوابة الإدارة</h3>
            <p class="text-gray-700 text-[8px] mb-10 uppercase tracking-[0.4em] font-black" data-i18n="secure_access">Secure Access</p>
            <div class="space-y-4">
                <input type="text" id="lock-user" data-i18n="username" class="text-center">
                <input type="password" id="lock-pass" data-i18n="password" onkeydown="if(event.key==='Enter') unlockAdmin()" class="text-center">
            </div>
            <button onclick="unlockAdmin()" class="btn-gold w-full py-4 rounded-xl font-black mt-10 text-xs" data-i18n="login">دخول</button>
            <div class="mt-8 flex justify-center gap-4"><button onclick="I18n.setLang(I18n.lang === 'ar' ? 'en' : 'ar')" class="text-[8px] border border-gold/30 px-3 py-1 rounded text-gold">AR / EN</button><a href="index.html" class="text-[8px] text-gray-800 underline">EXIT</a></div>
        </div>
    </div>

    <!-- ADMIN CONTENT -->
    <div id="admin-content" class="hidden">
        <aside id="sidebar" class="sidebar glass p-8 fixed right-0 top-0 h-full w-[280px] z-[200]">
            <div class="mb-12"><h1 class="text-2xl font-black text-gold">ZOLNGEN <span class="text-[7px] block text-white/20 uppercase tracking-[0.5em] font-black mt-1">OS V106.0</span></h1></div>
            <nav class="space-y-1">
                <button onclick="showTab('overview')" class="tab-btn active w-full text-right p-3 px-5 flex items-center gap-3 font-black text-[11px]"><i class="fas fa-radar w-3"></i> <span data-i18n="admin">Dashboard</span></button>
                <button onclick="showTab('supply')" class="tab-btn w-full text-right p-3 px-5 flex items-center gap-3 font-black text-[11px]"><i class="fas fa-microchip w-3"></i> <span data-i18n="inventory">Inventory</span></button>
                <button onclick="showTab('ops')" class="tab-btn w-full text-right p-3 px-5 flex items-center gap-3 font-black text-[11px]"><i class="fas fa-tasks w-3"></i> <span data-i18n="orders">Operations</span></button>
                <button onclick="showTab('hr')" class="tab-btn w-full text-right p-3 px-5 flex items-center gap-3 font-black text-[11px]"><i class="fas fa-user-tie w-3"></i> <span data-i18n="hr">HR</span></button>
                <button onclick="showTab('security')" class="tab-btn w-full text-right p-3 px-5 flex items-center gap-3 font-black text-[11px]"><i class="fas fa-shield-halved w-3"></i> <span data-i18n="security">Security</span></button>
                <button onclick="showTab('settings')" class="tab-btn w-full text-right p-3 px-5 flex items-center gap-3 font-black text-[11px]"><i class="fas fa-cog w-3"></i> <span data-i18n="settings">Settings</span></button>
            </nav>
            <div class="mt-12 pt-8 border-t border-white/5"><button onclick="Auth.logout()" class="w-full p-3 bg-red-500/5 text-red-500 rounded-lg text-[8px] font-black uppercase" data-i18n="logout">EXIT</button></div>
        </aside>

        <main class="main mr-[280px] p-[60px]">
            <header class="flex justify-between items-end mb-16">
                <div><h2 id="tab-title" class="text-5xl font-black tracking-tighter" data-i18n="admin_gate">Command Center</h2><p class="text-gray-800 uppercase tracking-[0.5em] text-[8px] font-black mt-2">OMNI-SYSTEM INTEGRATION ACTIVE</p></div>
                <div class="text-right glass px-6 py-3 rounded-2xl border border-white/5"><p id="admin-name" class="text-gold font-black text-sm">System Master</p><small class="text-gray-800 text-[7px] uppercase font-black">Level 10 Core</small></div>
            </header>

            <section id="tab-overview" class="tab-content space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="glass p-6 rounded-2xl border-b border-gold/40 text-center"><p class="text-gray-800 text-[7px] uppercase font-black mb-1" data-i18n="stats_revenue">Revenue</p><h3 id="stat-sales" class="text-xl font-black text-gold">0</h3></div>
                    <div class="glass p-6 rounded-2xl border-b border-green-500/40 text-center"><p class="text-gray-800 text-[7px] uppercase font-black mb-1" data-i18n="stats_profit">Profit</p><h3 id="stat-profit" class="text-xl font-black text-green-500">0</h3></div>
                    <div class="glass p-6 rounded-2xl border-b border-blue-500/40 text-center"><p class="text-gray-800 text-[7px] uppercase font-black mb-1" data-i18n="stats_inventory">Assets</p><h3 id="stat-inv" class="text-xl font-black text-blue-400">0</h3></div>
                    <div class="glass p-6 rounded-2xl border-b border-purple-500/40 text-center"><p class="text-gray-800 text-[7px] uppercase font-black mb-1" data-i18n="stats_health">Health</p><h3 class="text-xl font-black text-purple-500">99.8%</h3></div>
                </div>
                <div class="glass p-10 rounded-[40px] border border-white/5"><canvas id="forecastChart" height="100"></canvas></div>
            </section>

            <section id="tab-supply" class="tab-content hidden space-y-6">
                <div class="flex justify-between items-center"><h3 class="text-3xl font-black" data-i18n="inventory">Supply Chain</h3><button onclick="openModal('prod-modal')" class="bg-gold text-dark px-8 py-2 rounded-lg font-black text-[10px]" data-i18n="add_product">Add Unit</button></div>
                <div class="glass rounded-[30px] overflow-hidden"><table class="w-full text-right text-[10px]"><thead class="bg-white/5 text-gray-800 uppercase font-black text-[7px]"><tr><th class="p-5" data-i18n="products">Unit</th><th class="p-5" data-i18n="category">Cat</th><th class="p-5" data-i18n="price">Price</th><th class="p-5" data-i18n="stock">Qty</th><th class="p-5 text-center" data-i18n="actions">Ops</th></tr></thead><tbody id="inv-body"></tbody></table></div>
            </section>
        </main>
    </div>

    <!-- MODALS -->
    <div id="modal-bg" class="fixed inset-0 z-[600] bg-black/98 backdrop-blur-3xl hidden flex items-center justify-center p-6"><div id="prod-modal" class="glass p-12 rounded-[50px] max-w-sm w-full border border-gold/10 hidden"><h3 class="text-2xl font-black mb-8 text-gold" data-i18n="add_product">Unit Sync</h3><form id="prod-form" class="space-y-4"><input type="hidden" id="p-id"><input type="text" id="p-name" placeholder="Model"><input type="text" id="p-cat" placeholder="Category"><div class="grid grid-cols-2 gap-4"><input type="number" id="p-price" placeholder="Price"><input type="number" id="p-stock" placeholder="Qty"></div><button type="submit" class="btn-gold w-full py-4 rounded-xl font-black mt-6 text-xs" data-i18n="save">Sync to Repo</button><button type="button" onclick="closeModal()" class="w-full text-gray-800 text-[10px] uppercase font-black mt-4" data-i18n="cancel">Abort</button></form></div></div>

    <script src="database.js"></script><script src="auth.js"></script><script src="ui.js"></script><script src="i18n.js"></script><script src="admin.js"></script>
    <script>
        const cur = document.querySelector('.cursor');
        document.addEventListener('mousemove', e => { gsap.to(cur, { x: e.clientX, y: e.clientY, duration: 0.1 }); });
        checkInit = () => {
            const s = Auth.getSession();
            if(s && s.role === 'ADMIN') {
                gsap.to('#admin-lock-screen', { opacity: 0, scale: 1.2, filter: 'blur(20px)', duration: 1, ease: "power4.out", onComplete: () => {
                    document.getElementById('admin-lock-screen').style.display = 'none';
                    document.getElementById('admin-content').classList.remove('hidden');
                    renderAdmin();
                }});
                document.getElementById('admin-name').innerText = s.name;
            } else {
                document.getElementById('admin-lock-screen').style.display = 'flex';
                document.getElementById('admin-content').classList.add('hidden');
            }
        };
        function showTab(id) { document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById('tab-' + id).classList.remove('hidden'); event.currentTarget.classList.add('active'); renderAdmin(); }
        function renderAdmin() {
            const stats = DB.getProStats();
            document.getElementById('stat-sales').innerText = stats.totalSales.toLocaleString() + ' JOD';
            document.getElementById('stat-profit').innerText = (stats.totalSales * 0.25).toLocaleString() + ' JOD';
            document.getElementById('stat-inv').innerText = stats.inventoryValue.toLocaleString() + ' JOD';
            const invBody = document.getElementById('inv-body');
            invBody.innerHTML = DB.getProducts().map(p => `<tr class="border-b border-white/5 hover:bg-white/2 transition-all"><td class="p-5 font-black">${p.name}</td><td class="p-5 text-gray-800 uppercase font-black text-[7px] tracking-widest">${p.category}</td><td class="p-5 text-gold font-black">${p.price} JOD</td><td class="p-5 font-mono text-[9px] ${p.stock < 10 ? 'text-red-500 font-black' : ''}">${p.stock}</td><td class="p-5 text-center"><button onclick="editP('${p.id}')" class="text-gray-800 hover:text-gold mr-3"><i class="fas fa-edit"></i></button><button onclick="if(confirm('Terminate?')){DB.deleteProduct('${p.id}');renderAdmin();}" class="text-red-500/20 hover:text-red-500"><i class="fas fa-trash"></i></button></td></tr>`).join('');
            renderChart();
        }
        function renderChart() {
            const ctx = document.getElementById('forecastChart');
            if(!ctx) return;
            const stats = DB.getProStats();
            if(window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, { type: 'line', data: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ data: [stats.totalSales*0.2, stats.totalSales*0.5, stats.totalSales, stats.totalSales*1.9], borderColor: '#D4AF37', borderWidth: 1, tension: 0.6, fill: true, backgroundColor: 'rgba(212, 175, 55, 0.05)', pointRadius: 0 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#222', font: { size: 6 } } } } } });
        }
        function openModal(id) { document.getElementById('modal-bg').classList.remove('hidden'); document.getElementById(id).classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal-bg').classList.add('hidden'); document.querySelectorAll('#modal-bg > div').forEach(d => d.classList.add('hidden')); }
        if(I18n.lang === 'en') { document.body.classList.remove('rtl'); document.body.classList.add('ltr', 'ltr-mode'); document.body.style.direction = 'ltr'; document.querySelectorAll('.text-right').forEach(el => { el.classList.remove('text-right'); el.classList.add('text-left'); }); document.querySelector('.sidebar').style.right = 'auto'; document.querySelector('.sidebar').style.left = '0'; document.querySelector('.main').style.marginRight = '0'; document.querySelector('.main').style.marginLeft = '280px'; }
    </script>
</body>
</html>
