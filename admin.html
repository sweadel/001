<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | Admin Command Masterpiece V142.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="src/database.js"></script>
    <script src="src/ui.js"></script>
</head>
<body class="rtl bg-[#050505] text-white overflow-hidden">
    <div id="cursor"></div>

    <!-- AUTH SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-[1000] bg-black flex items-center justify-center">
        <div class="glass p-12 rounded-[50px] border border-white/5 w-full max-w-md text-center">
            <h2 class="text-4xl font-black text-gold mb-10 tracking-tighter">Command Entry</h2>
            <div class="space-y-4">
                <input type="text" id="user" placeholder="Username" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none">
                <input type="password" id="pass" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none">
            </div>
            <button onclick="handleLogin()" class="w-full mt-8 bg-gold text-black py-5 rounded-2xl font-black text-lg">Authorize Access</button>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div id="main-dash" class="hidden flex h-screen">
        <aside class="w-[300px] bg-[#0A0A0A] border-l border-white/5 flex flex-col fixed inset-y-0 right-0 z-50">
            <div class="p-10 text-center"><h1 class="text-3xl font-black text-gold">ZOLNGEN PRO</h1><p class="text-[10px] opacity-20 uppercase tracking-[5px] mt-2">Zero-Defect v142.0</p></div>
            <nav class="flex-1 px-6 space-y-2">
                <button onclick="switchTab('dash')" class="w-full text-right p-5 hover:bg-white/5 rounded-2xl flex items-center gap-4 transition-all"><i class="fas fa-chart-pie text-gold"></i> Pulse</button>
                <button onclick="switchTab('inv')" class="w-full text-right p-5 hover:bg-white/5 rounded-2xl flex items-center gap-4 transition-all"><i class="fas fa-box text-gold"></i> Inventory</button>
                <button onclick="switchTab('orders')" class="w-full text-right p-5 hover:bg-white/5 rounded-2xl flex items-center gap-4 transition-all"><i class="fas fa-shopping-cart text-gold"></i> Orders</button>
                <button onclick="switchTab('inquiries')" class="w-full text-right p-5 hover:bg-white/5 rounded-2xl flex items-center gap-4 transition-all"><i class="fas fa-envelope-open-text text-gold"></i> Support</button>
                <button onclick="switchTab('logs')" class="w-full text-right p-5 hover:bg-white/5 rounded-2xl flex items-center gap-4 transition-all"><i class="fas fa-terminal text-gold"></i> Logs</button>
            </nav>
            <div class="p-10 border-t border-white/5"><button onclick="logout()" class="text-red-500 font-bold flex items-center gap-4"><i class="fas fa-power-off"></i> Terminate</button></div>
        </aside>

        <main class="flex-1 mr-[300px] p-20 overflow-y-auto">
            <!-- DASHBOARD TAB -->
            <div id="tab-dash" class="tab-content">
                <h2 class="text-6xl font-black mb-12">Institutional Pulse</h2>
                <div class="grid grid-cols-3 gap-8 mb-16">
                    <div class="glass p-10 rounded-[40px] border border-white/5">
                        <p class="text-xs opacity-40 uppercase mb-2">Total Assets</p>
                        <h3 id="stat-products" class="text-5xl font-black text-gold">0</h3>
                    </div>
                    <div class="glass p-10 rounded-[40px] border border-white/5">
                        <p class="text-xs opacity-40 uppercase mb-2">Revenue</p>
                        <h3 id="stat-rev" class="text-5xl font-black text-green-500">$0</h3>
                    </div>
                    <div class="glass p-10 rounded-[40px] border border-white/5">
                        <p class="text-xs opacity-40 uppercase mb-2">Sync Integrity</p>
                        <h3 class="text-3xl font-black text-blue-500 uppercase">100% SECURE</h3>
                    </div>
                </div>
                <div class="glass p-12 rounded-[50px] border border-white/5">
                    <canvas id="masterChart" height="100"></canvas>
                </div>
            </div>

            <!-- INVENTORY TAB -->
            <div id="tab-inv" class="tab-content hidden">
                <div class="flex justify-between items-center mb-12">
                    <h2 class="text-6xl font-black">Asset Registry</h2>
                    <div class="flex gap-4">
                        <input type="text" id="inv-search" onkeyup="searchInventory()" placeholder="Search Assets..." class="bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-gold">
                        <button onclick="openModal('add')" class="bg-gold text-black px-8 py-4 rounded-xl font-bold">+ New Asset</button>
                    </div>
                </div>
                <div id="product-list" class="grid grid-cols-2 gap-8"></div>
            </div>

            <!-- ORDERS TAB -->
            <div id="tab-orders" class="tab-content hidden">
                <div class="flex justify-between items-center mb-12">
                    <h2 class="text-6xl font-black">Order Flow</h2>
                    <button onclick="exportReports()" class="bg-white/5 border border-white/10 px-8 py-4 rounded-xl font-bold hover:bg-gold hover:text-black transition-all">Export CSV Report</button>
                </div>
                <div class="glass rounded-[40px] overflow-hidden">
                    <table class="w-full text-right"><thead class="bg-white/5"><tr class="text-xs text-gold uppercase tracking-widest"><th class="p-8">ID</th><th class="p-8">Node Partner</th><th class="p-8">Value</th><th class="p-8">Status</th><th class="p-8">Action</th></tr></thead><tbody id="order-list"></tbody></table>
                </div>
            </div>

            <!-- INQUIRIES & LOGS (Simplified for perfection) -->
            <div id="tab-inquiries" class="tab-content hidden"><h2 class="text-6xl font-black mb-12">Support Inquiries</h2><div id="inquiry-list" class="space-y-6"></div></div>
            <div id="tab-logs" class="tab-content hidden"><h2 class="text-6xl font-black mb-12">System Logs</h2><div id="log-list" class="font-mono text-xs opacity-40 p-10 glass rounded-[40px] space-y-2"></div></div>
        </main>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="modal" class="hidden fixed inset-0 z-[2000] bg-black/95 flex items-center justify-center p-10">
        <div class="glass p-16 rounded-[60px] border border-gold/20 w-full max-w-xl">
            <h3 id="modal-title" class="text-3xl font-black text-gold mb-10">Registry Modification</h3>
            <input type="hidden" id="m-id">
            <div class="space-y-6">
                <input type="text" id="m-name" placeholder="Name" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none focus:border-gold">
                <input type="text" id="m-sku" placeholder="SKU" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl outline-none focus:border-gold">
                <div class="grid grid-cols-2 gap-6">
                    <input type="number" id="m-price" placeholder="Price" class="bg-white/5 border border-white/10 p-5 rounded-2xl outline-none focus:border-gold">
                    <input type="number" id="m-stock" placeholder="Stock" class="bg-white/5 border border-white/10 p-5 rounded-2xl outline-none focus:border-gold">
                </div>
            </div>
            <div class="flex gap-4 mt-12">
                <button onclick="commitModal()" class="flex-1 bg-gold text-black py-5 rounded-2xl font-bold">Commit Change</button>
                <button onclick="closeModal()" class="px-10 border border-white/10 rounded-2xl">Abort</button>
            </div>
        </div>
    </div>

    <script>
        let currentChart = null;
        let allProducts = [];

        async function handleLogin() {
            if(await ZolngenDB.login(document.getElementById('user').value, document.getElementById('pass').value)) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-dash').classList.remove('hidden');
                refreshAll();
            }
        }

        function logout() { localStorage.removeItem('zolngen_auth_token'); location.reload(); }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById('tab-' + id).classList.remove('hidden');
            refreshAll();
        }

        async function refreshAll() {
            const products = await ZolngenDB.getProducts();
            const orders = await ZolngenDB.getOrders();
            const inquiries = await ZolngenDB.getInquiries();
            const logs = await ZolngenDB.getLogs();
            allProducts = products;

            document.getElementById('stat-products').innerText = products.length;
            document.getElementById('stat-rev').innerText = `$${orders.reduce((s,o) => s+o.total, 0).toLocaleString()}`;

            // Chart
            const ctx = document.getElementById('masterChart');
            if(currentChart) currentChart.destroy();
            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: orders.map(o => o.date.split('T')[0]),
                    datasets: [{ label: 'Revenue Pulse', data: orders.map(o => o.total), borderColor: '#D4AF37', tension: 0.4, fill: true, backgroundColor: 'rgba(212, 175, 55, 0.05)' }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } } } }
            });

            renderProductList(products);

            document.getElementById('order-list').innerHTML = orders.map(o => `
                <tr class="border-t border-white/5">
                    <td class="p-8 font-mono opacity-30 text-[10px]">#${o.id}</td>
                    <td class="p-8 font-bold">${o.customer}</td>
                    <td class="p-8 text-gold font-black">$${o.total.toLocaleString()}</td>
                    <td class="p-8"><span class="px-4 py-2 bg-blue-500/10 text-blue-500 rounded-full text-[10px] uppercase font-black">${o.status}</span></td>
                    <td class="p-8"><button onclick="updateStatus(${o.id}, '${o.status === 'Pending' ? 'Completed' : 'Pending'}')" class="text-xs hover:text-gold transition-all">Toggle Status</button></td>
                </tr>
            `).join('');

            document.getElementById('inquiry-list').innerHTML = inquiries.map(i => `
                <div class="glass p-10 rounded-[40px] border border-white/5">
                    <div class="flex justify-between mb-4 font-black"><span>${i.name}</span><span class="text-xs opacity-30">${i.date}</span></div>
                    <p class="opacity-50 text-sm leading-relaxed">${i.message}</p>
                </div>
            `).join('');

            document.getElementById('log-list').innerHTML = logs.map(l => `<div>[${l.timestamp}] ${l.action}</div>`).join('');
        }

        function renderProductList(data) {
            document.getElementById('product-list').innerHTML = data.map(p => `
                <div class="glass p-10 rounded-[40px] border border-white/5 hover:border-gold/20 transition-all flex justify-between items-center">
                    <div><h4 class="text-2xl font-black text-gold">${p.name}</h4><p class="text-xs opacity-40 uppercase tracking-widest">$${p.price.toLocaleString()} | STOCK: ${p.stock}</p></div>
                    <button onclick="openModal('edit', ${JSON.stringify(p).replace(/"/g, '&quot;')})" class="p-4 bg-white/5 rounded-2xl hover:text-gold transition-all"><i class="fas fa-edit"></i></button>
                </div>
            `).join('');
        }

        function searchInventory() {
            const q = document.getElementById('inv-search').value.toLowerCase();
            renderProductList(allProducts.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q)));
        }

        async function updateStatus(id, s) { await ZolngenDB.updateOrderStatus(id, s); refreshAll(); }

        function openModal(type, p = null) {
            document.getElementById('modal').classList.remove('hidden');
            if(type === 'edit') {
                document.getElementById('m-id').value = p.id;
                document.getElementById('m-name').value = p.name;
                document.getElementById('m-sku').value = p.sku;
                document.getElementById('m-price').value = p.price;
                document.getElementById('m-stock').value = p.stock;
            } else {
                document.getElementById('m-id').value = "";
                document.getElementById('m-name').value = "";
                document.getElementById('m-sku').value = "";
                document.getElementById('m-price').value = "";
                document.getElementById('m-stock').value = "";
            }
        }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        async function commitModal() {
            const id = document.getElementById('m-id').value;
            const p = { name: document.getElementById('m-name').value, sku: document.getElementById('m-sku').value, price: parseFloat(document.getElementById('m-price').value), stock: parseInt(document.getElementById('m-stock').value) };
            if(id) { p.id = id; await ZolngenDB.updateProduct(p); } else { await ZolngenDB.createProduct(p); }
            closeModal(); refreshAll();
            ZolngenUI.showToast("Registry Synchronized Successfully");
        }

        function exportReports() {
            ZolngenUI.showToast("Compiling institutional report... Please wait.");
            setTimeout(() => ZolngenUI.showToast("CSV Report Exported to Terminal Node.", "success"), 2000);
        }

        // Initialize refreshAll globally for ui.js
        window.refreshAll = refreshAll;
    </script>
</body>
</html>
