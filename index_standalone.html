<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | منصة توريد التقنية المتكاملة</title>
    <!-- External Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* [Merged CSS from index.css and Admin styles] */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap');
        :root { --primary-gold: #D4AF37; --bg-black: #050505; --surface-dark: #121212; --surface-light: #1E1E1E; --glass-border: rgba(212, 175, 55, 0.25); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', 'Tajawal', sans-serif; }
        body { background: var(--bg-black); color: #fff; direction: rtl; overflow-x: hidden; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 2rem; }
        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 4000; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 1.2rem 0; }
        .hero { padding: 180px 0 100px; }
        .gold-gradient-text { background: linear-gradient(135deg, #D4AF37 0%, #FFF5D1 50%, #D4AF37 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-gold), #B8860B); color: black; border: none; padding: 0.8rem 1.5rem; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; padding: 4rem 0; }
        .product-card { background: var(--surface-light); border-radius: 12px; padding: 1.5rem; border: 1px solid transparent; transition: 0.4s; }
        .product-card:hover { border-color: var(--primary-gold); transform: translateY(-8px); }
        .footer { background: #000; padding: 5rem 0; border-top: 1px solid var(--glass-border); }
        /* Add more styles as needed for standalone */
    </style>
</head>
<body>
    <nav>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="#" class="logo" style="text-decoration: none;"><span class="gold-gradient-text" style="font-size: 1.5rem;">ZOLNGEN</span></a>
            <div style="display: flex; gap: 2rem;">
                <a href="#featured" style="color: white; text-decoration: none;">المنتجات</a>
                <a href="#contact" style="color: white; text-decoration: none;">طلب توريد</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; align-items: center;">
            <div>
                <h1 class="gold-gradient-text" style="font-size: 3.5rem; margin-bottom: 1.5rem;">توريد التقنية بمستويات عالمية</h1>
                <p style="font-size: 1.2rem; margin-bottom: 2rem;">الخيار الأول للجهات الحكومية والتعليمية في المملكة الأردنية الهاشمية.</p>
                <div style="display: flex; gap: 1rem;">
                    <a href="#featured" class="btn-primary">ابدأ الطلب</a>
                    <a href="#contact" class="btn-primary" style="background: transparent; border: 1px solid var(--primary-gold); color: var(--primary-gold);">تواصل معنا</a>
                </div>
            </div>
            <div style="text-align: center;">
                <img src="zolngen_hero_laptop.png" style="width: 80%; filter: drop-shadow(0 0 30px rgba(212,175,55,0.2));">
            </div>
        </div>
    </header>

    <section id="featured" class="container">
        <div class="products-grid" id="product-list">
            <!-- Injected via Script -->
        </div>
    </section>

    <footer class="footer">
        <div class="container" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 2rem;">
            <div><h3 class="gold-gradient-text">ZOLNGEN</h3><p style="color: #888;">التميز التقني المؤسسي.</p></div>
            <div><h4>روابط</h4><ul style="list-style: none; color: #888;"><li>الرئيسية</li><li>المنتجات</li></ul></div>
            <div><h4>تواصل</h4><p style="color: #888;">عمان، الأردن<br>info@zolngen.com</p></div>
            <div><h4>تابعنا</h4><div style="display: flex; gap: 1rem; color: var(--primary-gold);"><i class="fab fa-facebook"></i><i class="fab fa-linkedin"></i></div></div>
        </div>
    </footer>

    <script>
        // [Merged Logic from database.js, main.js]
        const products = [
            { id: 1, name: 'HP EliteBook 840 G9', price: 499, img: 'category_laptops.png' },
            { id: 2, name: 'Dell Latitude 5530', price: 549, img: 'category_laptops.png' },
            { id: 3, name: 'Lenovo ThinkPad X1 Carbon', price: 699, img: 'product_thinkpad_x1.png' }
        ];

        function render() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <div style="background: white; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; height: 180px; display: flex; align-items: center; justify-content: center;">
                        <img src="${p.img}" style="max-width: 100%; max-height: 100%;">
                    </div>
                    <h3>${p.name}</h3>
                    <p style="color: var(--primary-gold); font-weight: 700; margin: 1rem 0;">${p.price} د.أ</p>
                    <button class="btn-primary" style="width: 100%; justify-content: center;">أضف للطلب</button>
                </div>
            `).join('');
        }
        render();
    </script>
</body>
</html>
