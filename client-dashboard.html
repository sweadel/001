<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Portal | V100.4 MASTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700;900&family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .Platinum { border: 2px solid #E5E4E2; box-shadow: 0 0 50px rgba(229, 228, 226, 0.2); }
        .Gold { border: 2px solid #D4AF37; box-shadow: 0 0 50px rgba(212, 175, 55, 0.2); }
        .Silver { border: 2px solid #C0C0C0; box-shadow: 0 0 50px rgba(192, 192, 192, 0.2); }
        .chat-bubble { max-width: 85%; padding: 12px 16px; border-radius: 20px; font-size: 13px; }
        .sent { background: var(--gold); color: #000; align-self: flex-end; }
        .received { background: rgba(255,255,255,0.05); color: #fff; align-self: flex-start; }
    </style>
</head>
<body class="p-6 lg:p-12">
    <canvas id="neural-bg"></canvas>

    <!-- AUTH GUARD -->
    <script src="database.js"></script>
    <script src="auth.js"></script>
    <script>Auth.checkAccess('CLIENT');</script>

    <div class="max-w-7xl mx-auto space-y-12">
        <header class="flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="text-center md:text-right">
                <h2 id="client-name" class="text-4xl font-black">Portal</h2>
                <p class="text-gray-500 uppercase tracking-widest text-[10px] mt-2">Partner Ecosystem V100.4</p>
            </div>
            <div class="flex gap-4 items-center">
                <span id="tier-badge" class="px-8 py-2 rounded-full text-[10px] font-black uppercase bg-white/5">LOADING...</span>
                <button onclick="Auth.logout()" class="text-red-500 text-xs hover:underline">خروج</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div id="tier-card" class="glass p-12 rounded-[48px] text-center transition-all duration-500">
                <p class="text-gray-500 text-[10px] uppercase mb-2 tracking-widest">Investment</p>
                <h3 id="total-spend" class="text-4xl font-black text-gold">0 JOD</h3>
            </div>
            <div class="glass p-12 rounded-[48px] text-center border border-white/5">
                <p class="text-gray-500 text-[10px] uppercase mb-2 tracking-widest">Active Tickets</p>
                <h3 id="active-tickets" class="text-4xl font-black">0</h3>
            </div>
            <div class="glass p-12 rounded-[48px] text-center border-b-4 border-green-500/30">
                <p class="text-gray-500 text-[10px] uppercase mb-2 tracking-widest">Security Level</p>
                <h3 class="text-4xl font-black text-green-500 uppercase">Class A</h3>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-12">
            <!-- Order Feed -->
            <div class="glass p-10 rounded-[48px] border border-white/5">
                <h4 class="text-xl font-bold mb-8">سجل العمليات</h4>
                <div id="order-list" class="space-y-4 max-h-[400px] overflow-y-auto"></div>
            </div>

            <!-- HQ Support Chat -->
            <div class="glass p-10 rounded-[48px] border border-white/5 flex flex-col h-[500px]">
                <h4 class="text-xl font-bold mb-8 flex justify-between items-center">
                    التواصل مع المركز 
                    <span class="text-[8px] px-3 py-1 bg-green-500/10 text-green-500 rounded-full animate-pulse">متصل الآن</span>
                </h4>
                <div id="chat-box" class="flex-1 overflow-y-auto flex flex-col space-y-4 mb-8"></div>
                <div class="flex gap-4">
                    <input type="text" id="chat-input" placeholder="اطلب مساعدة أو استفسر عن طلب..." class="flex-1">
                    <button onclick="sendMsg()" class="bg-gold text-dark px-8 rounded-2xl font-black"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
    <script>
        function renderPortal() {
            const session = Auth.getSession();
            const entity = session.user;
            document.getElementById('client-name').innerText = entity;

            const tier = DB.getTier(entity);
            const badge = document.getElementById('tier-badge');
            badge.innerText = `${tier} TIER`;
            badge.className = `px-8 py-2 rounded-full text-[10px] font-black uppercase ${tier}`;
            document.getElementById('tier-card').className = `glass p-12 rounded-[48px] text-center transition-all ${tier}`;

            const orders = DB.getOrders().filter(o => o.entity === entity);
            document.getElementById('total-spend').innerText = orders.reduce((a,b) => a+b.total, 0).toLocaleString() + ' JOD';
            
            const tickets = DB.getTickets().filter(t => t.entity === entity && t.status === 'open');
            document.getElementById('active-tickets').innerText = tickets.length;

            const list = document.getElementById('order-list');
            list.innerHTML = orders.map(o => `
                <div class="flex justify-between items-center p-6 bg-white/5 rounded-3xl border border-white/5 hover:border-gold/30 transition-all">
                    <div class="text-xs">
                        <p class="font-bold text-gold mb-1">ID: ${o.id}</p>
                        <p class="opacity-50">${o.date}</p>
                    </div>
                    <div class="text-left">
                        <p class="font-black">${o.total} JOD</p>
                        <p class="text-[8px] uppercase px-2 py-1 bg-white/10 rounded mt-1">${o.status}</p>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-gray-700 py-20">لا توجد عمليات مسجلة</p>';

            loadChat();
        }

        function loadChat() {
            const session = Auth.getSession();
            const box = document.getElementById('chat-box');
            const msgs = DB.getMessages(session.user);
            box.innerHTML = msgs.map(m => `
                <div class="chat-bubble ${m.sender === session.user ? 'sent' : 'received'}">
                    <p>${m.text}</p>
                    <small class="text-[7px] block mt-1 opacity-40">${m.date}</small>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function sendMsg() {
            const session = Auth.getSession();
            const input = document.getElementById('chat-input');
            if(!input.value) return;
            DB.sendMessage({ sender: session.user, receiver: 'ADMIN', text: input.value, entity: session.user });
            input.value = ''; loadChat();
        }

        window.onload = () => { UI.initNeural(); renderPortal(); setInterval(loadChat, 4000); };
    </script>
</body>
</html>
