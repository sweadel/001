<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOLNGEN | لوحة تحكم المؤسسة</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">

    <nav class="navbar" style="background:rgba(0,0,0,0.8);">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">
                <img src="zolngen_logo.png" alt="ZOLNGEN" style="height:45px;" onerror="this.src='https://ui-avatars.com/api/?name=Z&background=D4AF37&color=000'">
            </a>
            <div id="inst-title" style="color:var(--gold); font-weight:800; font-size:1.2rem;"></div>
            <div style="display:flex; align-items:center; gap:1rem;">
                <span id="client-user-name" style="color:#888;"></span>
                <a href="index.html" class="btn btn-outline" style="padding:5px 15px; font-size:0.8rem;">العودة للمتجر</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top:50px; padding-bottom:100px;">
        <div class="reveal active">
            <h1 style="margin-bottom:3rem; font-size:2.5rem; background:var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">بوابة الشريك المؤسسي</h1>
            
            <!-- Stats Row -->
            <div class="cat-grid" style="margin-top:0; margin-bottom:4rem;">
                <div class="cat-card">
                    <i class="fas fa-shopping-cart"></i>
                    <h3 id="total-orders-count">0</h3>
                    <p>إجمالي الطلبات</p>
                </div>
                <div class="cat-card">
                    <i class="fas fa-wallet"></i>
                    <h3 id="total-spend-val">0</h3>
                    <p>إجمالي الإنفاق (JOD)</p>
                </div>
                <div class="cat-card">
                    <i class="fas fa-tools"></i>
                    <h3 id="active-tickets-count">0</h3>
                    <p>تذاكر صيانة نشطة</p>
                </div>
                <div class="cat-card">
                    <i class="fas fa-percentage"></i>
                    <h3 id="inst-discount">15%</h3>
                    <p>خصم المؤسسة المعتمد</p>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: 2fr 1fr; gap:2.5rem;">
                <!-- Recent Orders -->
                <div class="maintenance-box" style="display:block; padding:3rem;">
                    <h2 style="color:var(--gold); margin-bottom:2rem;"><i class="fas fa-history"></i> سجل التوريد الأخير</h2>
                    <div id="recent-orders-list"></div>
                </div>

                <!-- Support & Analytics -->
                <div style="display:flex; flex-direction:column; gap:2.5rem;">
                    <div class="cat-card" style="text-align:right; padding:2rem;">
                        <h4 style="color:var(--gold); margin-bottom:1.5rem;">تحليل الإنفاق</h4>
                        <div style="height:200px;">
                            <canvas id="spendChart"></canvas>
                        </div>
                    </div>
                    <div class="cat-card" style="text-align:right; padding:2rem;">
                        <h4 style="color:var(--gold); margin-bottom:1rem;">الدعم التقني المباشر</h4>
                        <p style="color:#666; font-size:0.9rem; margin-bottom:1.5rem;">يمكنك التواصل مع فريق الدعم الفني المخصص لمؤسستكم.</p>
                        <button class="btn btn-gold" style="width:100%; justify-content:center;" onclick="location.href='maintenance.html'">فتح بلاغ جديد</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="database.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sessionClient = sessionStorage.getItem('zolngen_client_user');
            if(!sessionClient) {
                alert('يرجى تسجيل الدخول أولاً');
                location.href = 'index.html';
                return;
            }
            const acc = JSON.parse(sessionClient);
            document.getElementById('inst-title').innerText = acc.inst;
            document.getElementById('client-user-name').innerText = acc.name;

            // Load Data
            const orders = DB.getOrders().filter(o => o.entity === acc.inst);
            const tickets = DB.getTickets().filter(t => t.entity === acc.inst && t.status === 'open');
            
            const totalSpend = orders.reduce((acc, o) => acc + o.total, 0);
            document.getElementById('total-orders-count').innerText = orders.length;
            document.getElementById('total-spend-val').innerText = totalSpend.toLocaleString();
            document.getElementById('active-tickets-count').innerText = tickets.length;

            // Render Orders
            const list = document.getElementById('recent-orders-list');
            list.innerHTML = orders.length ? orders.map(o => `
                <div style="background:rgba(255,255,255,0.02); border-right:3px solid var(--gold); padding:20px; border-radius:10px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-weight:800; color:#fff;">رقم الطلب: #${o.id}</div>
                        <div style="font-size:0.8rem; color:#666;">التاريخ: ${o.date}</div>
                    </div>
                    <div style="text-align:center;">
                        <div style="color:var(--gold); font-weight:900;">${o.total.toFixed(2)} JOD</div>
                        <span style="font-size:0.7rem; background:${o.status==='delivered'?'#2ecc71':'#f39c12'}; color:#fff; padding:2px 8px; border-radius:10px;">${o.status}</span>
                    </div>
                    <button class="btn btn-outline" style="padding:5px 15px; font-size:0.8rem;" onclick="parent.window.printInvoice('${o.id}')">الفاتورة</button>
                </div>
            `).join('') : '<p style="color:#555;">لا يوجد سجل طلبات حالياً.</p>';

            // Chart
            const ctx = document.getElementById('spendChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr'],
                    datasets: [{
                        label: 'Expenditure',
                        data: [totalSpend * 0.2, totalSpend * 0.3, totalSpend * 0.1, totalSpend * 0.4],
                        backgroundColor: '#D4AF37'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, grid: { color: '#222' } }, x: { grid: { display: false } } },
                    plugins: { legend: { display: false } }
                }
            });
        });
    </script>
</body>
</html>
